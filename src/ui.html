// Clipboard writes stay behind a press, like the paste button does.
//
// Two things were wrong with the first version and both were invisible.
// The text was interpolated into the onclick attribute with JSON.stringify,
// which emits a double-quoted string into a double-quoted attribute: the
// attribute ended at the first quote and the handler was a syntax error, so
// the button did nothing at all. And the failure was swallowed, so a button
// that could not work looked exactly like a button that had worked.
//
// Now the text is looked up by name at click time -- nothing user-visible
// goes through an attribute -- and every outcome says what happened. The
// fallback selects the block so Cmd-C or Ctrl-C finishes the job, because
// a WKWebView without clipboard access is a real case and "nothing
// happened" is the worst possible answer in it.
function copyCfg(name){
  const g=(AGENTS||[]).find(x=>x.name===name); if(!g)return;
  doCopy((g.configs&&g.configs[AGHOST])||'', 'copy-cfg-'+name, 'cfg-'+name);
}
function copyGrant(name){
  const g=(AGENTS||[]).find(x=>x.name===name); if(!g)return;
  doCopy(g.grant||'', 'copy-grant-'+name, 'grant-'+name);
}
async function doCopy(text, tagId, blockId){
  const tag=document.getElementById(tagId);
  const say=(m,bad)=>{ if(!tag)return; tag.textContent=m;
    tag.className='copied'+(bad?' bad':''); };
  if(!text){ say('nothing to copy', true); return; }
  try{
    if(!navigator.clipboard||!navigator.clipboard.writeText)throw new Error('no clipboard');
    await navigator.clipboard.writeText(text);
    say('Copied');
    setTimeout(()=>{ if(tag&&tag.textContent==='Copied')tag.textContent=''; },2500);
  }catch(e){
    // Select it instead, and say which key finishes the job.
    const el=document.getElementById(blockId);
    try{
      const r=document.createRange(); r.selectNodeContents(el);
      const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      say(navigator.platform.indexOf('Mac')>=0 ? 'Selected -- press Cmd-C'
                                               : 'Selected -- press Ctrl-C', true);
    }catch(e2){ say('Could not copy; select the text above', true); }
  }
}

async function agentLoad(){
  try{
    const r=await fetch('/api/agents');
    if(!r.ok)throw new Error('HTTP '+r.status);
    AGENTS=(await r.json()).agents||[];
  }catch(e){ AGERR='Could not read the agent list: '+(e&&e.message?e.message:e); }
  agentRender();
}

async function agentRemove(name){
  AGBUSY=true;AGERR='';agentRender();
  try{
    const r=await fetch('/api/agent/remove',{method:'POST',
      headers:{'Content-Type':'application/json','X-Gage':'1'},
      body:JSON.stringify({name:name})});
    const j=await r.json();
    if(!r.ok||j.error)AGERR=j.error||('Could not remove '+name+'.');
    else AGERR='Removed '+name+'. Its key is retired, not forgotten, so what it '
      +'already sent keeps its verdict. If an MCP host still points at it, '
      +'remove it there too.';
  }catch(e){ AGERR='Could not remove '+name+': '+(e&&e.message?e.message:e); }
  AGBUSY=false; AGKILL=''; await agentLoad();
}
async function agentCreate(){
  AGBUSY=true;AGERR='';AGNEW=null;agentRender();
  try{
    const r=await fetch('/api/agent',{method:'POST',
      headers:{'X-Gage':'1','Content-Type':'application/json'},
      body:JSON.stringify({name:AGNAME.trim()})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
    AGNAME='';AGNEW=j.name;
  }catch(e){ AGERR=(e&&e.message)?e.message:String(e); }
  AGBUSY=false; await agentLoad(); AGNEW=null;
}

function budRender(force){
  // The cards -- the decisions -- render into the wide pane. The rail beside
  // them holds this machine's identity and the explanation, so neither the
  // thing you act on nor the thing you hand over is in the narrow column by
  // accident.
  const box=document.getElementById('budpane');
  const side=document.getElementById('budside');
  if(!box||!side||TAB!=='buddies')return;
  let h='';
  const requests=(BUD.requests||[]).map(q=>q.key===PKEY?{...q,label:PNAME||q.label,
    ask_pair:PPAIR,pasted:true}:q);
  if(PKEY&&!requests.some(q=>q.key===PKEY))requests.unshift({key:PKEY,label:PNAME||'Pasted invite',
    bundles:0,verdict:'SENDER NOT ON YOUR LIST',first_observed:null,ask_pair:PPAIR,pasted:true});
  if(requests.length){
    h+=`<div class="bsec">Not on your list<span class="bnum">${requests.length}</span></div>`
     +`<div class="lansub budnote gap">${requests.some(q=>q.pasted)?'Pasted invites and keys that have sent you something are not on your list. ':''}A message is not a request for anything &mdash; deciding is yours, and doing nothing is a decision the list will keep offering.</div>`
     +`<div class="budgrid">`;
    for(const q of requests){
      const open=ASK===q.key;
      const shown=(REVEAL&&REVEAL.key===q.key)?REVEAL.fp:null;
      h+=`<div class="dev ask">
        <div class="devtop"><span class="devname">${esc(q.label)}</span>
          <span class="devtag">${q.bundles} message${q.bundles===1?'':'s'}</span>
          </div>
        <div class="bwhy gap">${esc(vShort(q.verdict))}
          ${q.first_observed?'&middot; first seen here '+esc(ago(q.first_observed)):''}
          &middot; pair 1 of its fingerprint is <b>${esc(q.label)}</b></div>
        ${shown?`<div class="devfp">${esc(shown)}</div>`:''}
        <div class="devrow">
          <button class="devbtn${open?'':' go'}" onclick="askOpen('${esc(q.key)}')">${open?'Cancel':'Add to my list'}</button>
          <button class="devbtn quiet" onclick="budDecline('${esc(q.key)}',false)" ${ABUSY?'disabled':''}
            title="Records that you said no. It does not block anything: mail from this key still arrives and still waits for you to accept it.">Refuse</button>
        </div>
        <div class="bwhy">Refusing records the decision so you are not asked again. It does
          not stop anything arriving.</div>`;
      if(open&&!shown){
        h+=`<div class="bgate">
          <div class="bwhy">${esc(ASKWHY)}</div>
          <div class="bwhy">${esc(ASKHALF)}</div>
          <div class="bwhy bwarn">${esc(ASKTRAP)}</div>
          ${q.pasted?`<div class="bwhy">Suggested name (edit as needed)</div>
            <input class="lanin wide" placeholder="Name for this contact" value="${esc(ANAME)}"
              oninput="ANAME=this.value">`:''}
          <div class="bwhy">Type pair <b>${q.ask_pair}</b> of four, as the other machine shows it.</div>
          <input class="lanin wide" placeholder="pair ${q.ask_pair}, e.g. two words" value="${esc(ACONF)}"
            oninput="ACONF=this.value" onkeydown="if(event.key==='Enter')budReveal('${esc(q.key)}')">
          <div class="devrow">
            <button class="devbtn go" onclick="budReveal('${esc(q.key)}')" ${ABUSY?'disabled':''}>
              ${ABUSY?'Checking...':'Check this pair'}</button>
          </div></div>`;
      }else if(open&&shown){
        h+=`<div class="bgate">
          <div class="bwhy">Pair ${q.ask_pair} matched. Now check <b>all four</b> above against
            the other machine before you add anything &mdash; one matching pair is 16 bits, and
            a key can be ground out to produce a chosen one.</div>
          <input class="lanin wide" placeholder="Call them what on your list?" value="${esc(ANAME)}"
            oninput="ANAME=this.value">
          <div class="devrow">
            <button class="devbtn go" onclick="budConnect('${esc(q.key)}')" ${ABUSY?'disabled':''}>
              ${ABUSY?'Adding...':'All four match -- add them'}</button>
          </div></div>`;
      }
      h+=`</div>`;
    }
    h+=`</div>`;
  }
  h+=`<div class="bsec">Your list<span class="bnum">${BUD.buddies.length}</span></div>`;
  if(!BUD.buddies.length){
    h+=`<div class="lansub budnote">Nobody yet. Pair with a buddy on this network to add their key, then confirm its word-pairs with them.</div>`;
  }
  // The agents this machine made are on the contact list too -- they have to
  // be -- but they are not people to compare word-pairs with over a call, and
  // showing them here asked you to. Counted rather than hidden, with their
  // unread, so nothing goes quiet.
  const ags=BUD.agents_on_list||[];
  if(ags.length){
    const un=ags.reduce((t,a)=>t+a.unread,0);
    h+=`<div class="lansub budnote">${ags.length===1?'One agent on this machine is':
      `${ags.length} agents on this machine are`} also on your list
      (${ags.map(a=>esc(a.name)).join(', ')}) &mdash; their keys came out of a keygen this
      machine ran, so there is nobody to compare pairs with. They are on
      <button class="blink" onclick="setTab('agents')">the Agents tab</button>.${
      un?` <b>${un} unread</b> from them, in Chats.`:''}</div>`;
  }
  h+=`<div class="budgrid">`;
  for(const b of BUD.buddies){
    h+=`<div class="dev">
      <div class="devtop"><span class="devname">${esc(b.name)}</span>
        ${b.unread?`<span class="bnum">${b.unread} unread</span>`:''}
        ${b.confirmed?'<span class="devtag ok" title="Somebody compared this key\'s four word-pairs against the other machine, over a channel neither machine controls.">confirmed</span>'
                     :`<span class="devtag warn" title="On your list, but nothing here records anybody comparing its word-pairs.">${b.stale?'confirmation stale':'unconfirmed'}</span>`}
        ${b.sealable?'<span class="devtag ok">sealable</span>'
                    :'<span class="devtag" title="A bundle does not carry its sender\'s encryption key, so a contact added from a message is verify-only.">verify only</span>'}</div>
      ${b.confirmed
        ? `<div class="devfp">${esc(b.fingerprint)}</div>`
        : `<div class="bwhy">${b.stale
            ? 'What was confirmed for this contact no longer covers the key on file &mdash; an encryption key was added after the comparison, and the words that were checked did not cover it. Confirm it again.'
            : 'Nobody has compared this key\'s word-pairs. It is on your list, so its mail arrives and is attributable &mdash; but nothing here records that the key belongs to the person whose name is beside it.'}
            Their mail reads <b>SENDER ON YOUR LIST, UNCONFIRMED</b> until somebody does.</div>
           <div class="bwhy">This key's device label is <b>${esc(b.label)}</b> &mdash; derived from the
             signing key alone, which is all a manifest carries, so it is <i>not</i> the first of the
             four pairs when there is an encryption key as well. It tells entries apart and nothing more.
             The four pairs are deliberately not shown here: ask them to run
             <code>gage fingerprint${b.sealable?'':' --signing-only'}</code> and read them out over a call,
             then type all four below.</div>
           <div class="devrow">
             <input class="lanin wide" placeholder="all four pairs, as their machine shows them"
               value="${esc(CONFW[b.name]||'')}"
               oninput="CONFW['${esc(b.name)}']=this.value" ${ABUSY?'disabled':''}>
             <button class="devbtn" onclick="budConfirm('${esc(b.name)}')" ${ABUSY?'disabled':''}>
               ${ABUSY?'Checking...':'Confirm'}</button>
           </div>
           ${CONFE[b.name]?`<div class="lanerr">${esc(CONFE[b.name])}</div>`:''}`}
      ${reachRow(b.reach)}
    </div>`;
  }
  h+=`</div>`;
  if(BUD.refused.length){
    h+=`<div class="bsec"><button class="bsect" onclick="SHOWREF=!SHOWREF;budRender(true)"
      >Refused (${BUD.refused.length}) ${SHOWREF?'&#9662;':'&#9656;'}</button></div>`;
    if(SHOWREF){
      h+=`<div class="lansub gap">Refusing records a decision. It does
        not block anything &mdash; nothing in gage can stop a bundle being delivered, and
        mail from these keys still arrives and still waits for you to accept it. What it
        buys is that you are not asked about these again. Their word-pairs are not shown
        here, so that un-refusing one puts you back in front of the same check.</div>
        <div class="budgrid">`;
      for(const r of BUD.refused){
        h+=`<div class="dev">
          <div class="devtop"><span class="devname">${esc(r.label)}</span>
            <span class="devtag">refused ${esc(r.at)}</span>
            ${r.holding?`<span class="devtag">${r.holding} here now</span>`:''}</div>
          <div class="devrow">
            <button class="devbtn" onclick="budDecline('${esc(r.key)}',true)" ${ABUSY?'disabled':''}>
              Un-refuse</button>
          </div></div>`;
      }
      h+=`</div>`;
    }
  }
  // AERR and AOK are printed by pasteHtml, which is concatenated below.
  // Printing them here as well put the same failure on the screen twice.

  // This page polls every 2.5 seconds, and replacing innerHTML destroys the
  // focused node. That was survivable while the only inputs here were the
  // pairing fields, whose text is held in ANAME and ACONF and restored on
  // the next render -- the caret moved, which was already wrong. Since the
  // paste textarea moved into this subtree it is not survivable at all:
  // typing an invite line lost focus mid-word every 2.5 seconds.
  //
  // So a poll that would clobber a field somebody is typing in does not
  // render. An action the person takes always calls budRender directly, and
  // those paths pass force, because the whole point of them is that the
  // answer changed.
  const active = document.activeElement;
  if (!force && active && (box.contains(active) || side.contains(active))
      && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;
  box.innerHTML=`<div class="budwrap">${h}</div>`;
  // The rail is tall on this tab -- the QR, the paste field, the disclosure --
  // so a poll that redrew it must not also send it back to the top.
  const top=side.scrollTop;
  side.innerHTML=budpaneHtml();
  side.scrollTop=top;
}

async function budPost(path,body){
  ABUSY=true;AERR='';AOK='';budRender(true);
  try{
    const r=await fetch(path,{method:'POST',headers:{'X-Gage':'1','Content-Type':'application/json'},
      body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
    AOK=(j.lines||[]).filter(x=>x&&x.trim()).join(' ');
    ASK=null;ANAME='';ACONF='';REVEAL=null;
    if(path==='/api/connect'){PKEY='';PNAME='';PPAIR=0;PASTED='';}
  }catch(e){ AERR=(e&&e.message)?e.message:String(e); }
  ABUSY=false; await budLoad(); load();
}
function budConnect(k){
  const p = (REVEAL && REVEAL.key===k) ? REVEAL.pair : ACONF;
  budPost('/api/connect',{key:k,name:ANAME,confirm:p});
}
function budDecline(k,undo){ budPost('/api/decline',{key:k,undo:!!undo}); }

// Confirming is its own call rather than a flag on an add, because it happens
// at a different moment: the add is when a key arrives, the confirmation is
// after a phone call. The error is kept per contact, so one failed comparison
// does not clear the words somebody else is halfway through typing -- and the
// server never says what the right answer was.
async function budConfirm(name){
  const words=(CONFW[name]||'').trim();
  if(!words){ CONFE[name]='Type the four pairs they read out.'; budRender(true); return; }
  CONFE[name]='';ABUSY=true;budRender(true);
  try{
    const r=await fetch('/api/confirm',{method:'POST',
      headers:{'X-Gage':'1','Content-Type':'application/json'},
      body:JSON.stringify({name:name,words:words})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
    delete CONFW[name];
  }catch(e){ CONFE[name]=(e&&e.message)?e.message:String(e); }
  ABUSY=false; await budLoad(); load();
}

// ---------------------------------------------------------------------------
// Setup
// ---------------------------------------------------------------------------
// Five steps, every one of them derived from the same state the rest of this
// page renders, and none of them from a flag this tab keeps for itself. The
// project already carries three written setup narratives -- the README, the
// first-tester packet, and the first-run guide below -- and a fourth written
// in here would be the copy nobody updates. A derived checklist cannot
// disagree with the panes it points at, because it is reading what they read.
//
// A satisfied step states the fact that satisfies it rather than showing a
// tick: "me, four word-pairs" is something a person can check, a tick is a
// claim. No step borrows a verdict colour. A step is not a trust decision,
// and in this app a green badge means a key was verified.
//
// Each open step names the one action and then sends you to the pane that
// already does it. It never restates a control or a ceremony, because two
// implementations of the pairing gate is how the gate shipped broken once.
// Whether enough has arrived to answer any of this. Rendering steps from
// state that has not loaded is how the checklist briefly told a machine with
// two agents and one buddy that it knew three people: AGENTS starts null, so
// the agent filter below was empty and this machine's own agents counted as
// somebody else. Unknown is a third answer, and it has to be said out loud
// rather than defaulted to either of the other two.
function setupKnown(){ return ST!==null && AGENTS!==null; }
function setupSteps(){
  const agentNames=(AGENTS||[]).map(a=>a.name);
  // Contacts and this machine's own agents share one list on disk, so the
  // people have to be separated out -- otherwise wiring an agent would
  // quietly satisfy "somebody else's key is on your list", which is the one
  // step no amount of local setup can satisfy.
  const people=((ST&&ST.contacts)||[]).filter(c=>!agentNames.includes(c.name));
  const routed=people.filter(c=>c.routed);
  const nearby=((LAN&&LAN.devices)||[]).length;
  const accepted=((ST&&ST.accepted)||[]).length;
  // Deliberately "exists", not "works". /api/agents reports a grant line for
  // every agent, but that line is the one you are meant to paste -- it is a
  // suggestion, not evidence that any authority file contains it, and this
  // page cannot see whether an assistant ever loaded the config. A step that
  // claimed otherwise would be a tick standing in for a fact.
  const agents=(AGENTS||[]);
  const names=a=>a.map(x=>x.name).join(', ');
  return [
    {t:'This machine has an identity',
     done:!!(ST&&ST.has_identity&&ST.me),
     fact:(ST&&ST.me)?ST.me.handle+' · '+ST.me.key.slice(0,12)+'…':'',
     mono:true,
     act:(ST&&ST.has_identity)
        ?'A key file is here but will not load, so this is not a first run '
         +'and no guide will open over it. Nothing else can be done until it '
         +'reads again -- check its permissions before anything writes.'
        :'Choose a handle and create a key. The guide that opens on a first '
         +'run does exactly this, and nothing else here can be done until it has.',
     go:null,goL:''},
    {t:'An agent identity exists here',
     done:agents.length>0,
     fact:agents.length
         ?names(agents)+' — whether your assistant has loaded the config '
          +'is not something this page can see'
         :'',
     act:'Create one on the Agents tab. It writes the config your assistant '
        +'reads, with this machine’s real paths already in it; pasting '
        +'that config into the assistant is the half that happens outside gage.',
     go:'agents',goL:'Open Agents'},
    {t:'Somebody else’s key is on your list',
     done:people.length>0,
     fact:people.length?(people.length+' '+(people.length===1?'person':'people')+': '+names(people)):'',
     act:'Hand them your invite from the Buddies tab, or paste theirs, and '
        +'compare all four word-pairs aloud before you add them.',
     go:'buddies',goL:'Open Buddies'},
    {t:'You have a way to reach them',
     // All of these are tied to somebody being on the list. A relay with
     // nobody to send to is a configured address, and a stranger announcing
     // on this network is not a way to reach anyone -- either one on its own
     // used to satisfy this step.
     //
     // And handing a sealed file over counts, which it did not: this step
     // asked for a route, a relay or a LAN neighbour, so the whole
     // file-handover path -- `gage seal` on one machine, `gage unseal && gage
     // open` on the other, which is the path the first-tester packet now
     // LEADS with -- could be completed end to end and leave this step
     // reading "not yet" for ever. The packet promises five of five. A
     // checklist with a step nobody can reach teaches people to ignore it.
     //
     // A completed exchange is better evidence than a configured address
     // anyway: an address is a claim that a path exists, an exchange is the
     // path having worked.
     done:routed.length>0
         ||(people.length>0&&(!!(ST&&ST.relay)||nearby>0||accepted>0||!!(ST&&ST.ever_sent))),
     fact:routed.length?(routed.length+' with a saved address: '+names(routed))
         :(people.length>0&&ST&&ST.relay)?'a relay is set, and somebody is on your list'
         :(people.length>0&&nearby)?(nearby+' device'+(nearby===1?'':'s')+' on this network')
         :(people.length>0&&(accepted>0||(ST&&ST.ever_sent)))
             ?'something has already made the trip, which is better evidence than an address'
             :'',
     act:'Three ways, and none is required to receive: hand a sealed file over '
        +'(gage seal, then gage unseal and gage open at the other end), run '
        +'gage lan on both machines on the same network, or set a relay in the '
        +'rail on Conversations.',
     go:'chats',goL:'Open Conversations'},
    {t:'You have exchanged something real',
     // Accepted, not merely arrived. Anyone can put a bundle in front of you,
     // including a stranger and a tampered one; accepting is the act that
     // took it. A pending bundle is somebody else's doing, not an exchange.
     done:!!(ST&&ST.ever_sent)||accepted>0,
     fact:(ST&&ST.ever_sent)
         ?(accepted?'you have sent, and accepted something':'you have sent')
         :(accepted?'you have accepted something':''),
     act:'Send one small thing to somebody on your list. Publishing an anchor '
        +'does not count: that is not handing work to a person.',
     go:'chats',goL:'Open Conversations'},
  ];
}
// The badge counts nothing until the state it would count has arrived.
function setupOpenCount(){ return setupKnown()?setupSteps().filter(s=>!s.done).length:0; }
// The explanation keeps its own open flag, for the reason the buddies panel
// does: this pane re-renders on a 2s poll, and a <details> rebuilt from
// scratch shuts the paragraph you are reading within one tick.
let SUWHY=false;
function setupRender(){
  const el=document.getElementById('setuppane'); if(!el)return;
  // Nothing is claimed before the state that would decide it has arrived.
  if(!setupKnown()){
    el.innerHTML='<div class="setup"><div class="hint"><h2>Reading this machine</h2>'
      +'<p>The steps below are derived from this machine’s own state, so '
      +'there is nothing to say until it has been read.</p></div></div>';
    return;
  }
  const steps=setupSteps(), open=steps.filter(s=>!s.done).length;
  let h='<div class="setup">';
  h+='<div class="hint"><h2>'
    +(open?esc(open+' of '+steps.length+' left'):'Nothing left to set up')
    +'</h2><p>'
    +(open
      ?'Each step reads this machine’s own state, so it answers for this '
       +'machine and not for the project in general.'
      // Exactly the five predicates, and no more than they establish. An
      // earlier version of this sentence said "an agent that can use it" and
      // "somebody else's confirmed key"; neither is checked here. A key goes
      // on your list when it is added, and comparing the word-pairs is a
      // separate act this page cannot witness.
      :'This machine has an identity, an agent identity, somebody else’s '
       +'key on its list, a way to reach them, and a send or an acceptance '
       +'behind it.')
    +'</p></div>';
  steps.forEach((st,i)=>{
    h+='<div class="dev'+(st.done?' done':'')+'"><div class="step">'
      +'<span class="stepn">'+(i+1)+'</span><div class="stepb">'
      +'<div class="devtop"><span class="devname">'+esc(st.t)+'</span>'
      +'<span class="devtag">'+(st.done?'done':'not yet')+'</span></div>';
    if(st.done&&st.fact)
      h+='<div class="'+(st.mono?'devfp':'stept')+'">'+esc(st.fact)+'</div>';
    if(!st.done){
      h+='<div class="stept">'+esc(st.act)+'</div>';
      if(st.go)h+='<div class="devrow"><button class="devbtn" onclick="setTab(\''
        +st.go+'\')">'+esc(st.goL)+'</button></div>';
    }
    h+='</div></div></div>';
  });
  h+='<details class="disc"'+(SUWHY?' open':'')+' ontoggle="SUWHY=this.open">'
    +'<summary>Where the longer instructions are</summary>'
    +'<div class="hint"><p>This page deliberately contains no link: a viewer '
    +'that can point you somewhere else is a browser, and a test asserts there '
    +'is no address anywhere in it. For the long form, run <code>gage help</code> '
    +'in a terminal, or read the project’s own first-tester packet, which '
    +'walks two people through this same list in about twenty minutes.</p></div>'
    +'</details>';
  h+='</div>';
  el.innerHTML=h;
}

async function budLoad(){
  try{
    const r=await fetch('/api/buddies');
    if(!r.ok)throw new Error('HTTP '+r.status);
    BUD=await r.json();
    if(ASK&&!BUD.requests.some(q=>q.key===ASK))ASK=null;
  }catch(e){
    // Same rule as every other loader here: never fail invisibly.
    AERR='Could not read your list: '+(e&&e.message?e.message:e);
  }
  tabsRender(); budRender();
  // The agent list decides two of the five steps and was loaded exactly once,
  // so `gage agent new` in a terminal left this tab describing the machine as
  // it had been when the page opened. It is reloaded while this tab is the
  // one showing, and nowhere else.
  if(TAB==='setup'){ await agentLoad(); setupRender(); tabsRender(); }
}
budLoad();setInterval(budLoad,2500);
hashRead();
setTab(TAB);

// First-run guide. It uses the same local endpoints and nearby-device data as
// the console. The ceremony requires an explicit spoken-comparison checkbox
// before the fingerprint shown here is submitted to /api/pair.
let W={stage:'welcome',handle:'',words:[],warning:'',devices:[],chosen:'',name:'',compared:false,
  subject:'Hello from gage',message:'I have set up gage. Reply when you are ready.',error:'',busy:false};
function wRender(){
  const el=document.getElementById('wizard'); if(!el)return;
  const field=(id,val,placeholder)=>`<input class="winput" id="${id}" value="${esc(val)}" placeholder="${placeholder}" oninput="W.${id==='whandle'?'handle':id==='wname'?'name':id==='wsubject'?'subject':'message'}=this.value">`;
  let body='';
  if(W.stage==='welcome')body=`<h1>Welcome to gage</h1><p>Gage lets you exchange signed bundles with people you know. First choose a name for this machine, then compare word-pairs with a buddy before you send them a first bundle.</p><button class="btn go" onclick="W.stage='handle';wRender()">Get started</button>`;
  if(W.stage==='handle')body=`<h1>Choose a handle</h1><p>This name helps you and your buddies recognize this machine.</p>${field('whandle',W.handle,'Your handle')}<button class="btn go" onclick="wCreate()" ${W.busy?'disabled':''}>${W.busy?'Creating…':'Create identity'}</button>`;
  if(W.stage==='words')body=`<h1>Your word-pairs</h1><p>Keep these pairs available while you compare them with your buddy. They identify this machine.</p><div class="wwords">${esc(W.words.join('\n'))}</div><p>${esc(W.warning)}</p><p>For a backup, run <code>gage export-identity</code> in a terminal and keep the exported file safe.</p>`+inviteHtml()+`<button class="btn go" onclick="wNearby()">Continue to pairing</button>`;
  if(W.stage==='pair'){
    const d=W.devices.find(x=>x.label===W.chosen);
    body=`<h1>Pair with a buddy</h1><p>Both machines must be running <code>gage lan</code> on the same network. Select your buddy, read all four pairs aloud, and compare them with the other screen.</p>`+
      (W.devices.length?W.devices.map(x=>`<label class="wcheck"><input type="radio" name="wdevice" ${W.chosen===x.label?'checked':''} onchange="W.chosen='${esc(x.label)}';W.compared=false;wRender()"><span>${esc(x.paired_as||x.label)}</span></label>${W.chosen===x.label?`<div class="wwords">${esc(x.fingerprint)}</div>`:''}`).join(''):'<p>No nearby machines yet. Start <code>gage lan</code> on both machines, then refresh this step.</p>')+
      `<button class="btn" onclick="wNearby()">Refresh nearby machines</button>`+
      (d?`<label class="wcheck"><input type="checkbox" ${W.compared?'checked':''} onchange="W.compared=this.checked;wRender()"><span>We compared these aloud and all four pairs match.</span></label>${field('wname',W.name,'Name for this buddy')}<button class="btn go" onclick="wPair()" ${!W.compared||W.busy?'disabled':''}>${W.busy?'Pairing…':'Pair buddy'}</button>`:'');
  }
  if(W.stage==='send')body=`<h1>Send your first bundle</h1><p>Write a short message for ${esc(W.name)}. Gage will send it through the existing bundle flow.</p>${field('wsubject',W.subject,'Subject')}<textarea class="winput" id="wmessage" oninput="W.message=this.value">${esc(W.message)}</textarea><button class="btn go" onclick="wSend()" ${W.busy?'disabled':''}>${W.busy?'Sending…':'Send first bundle'}</button>`;
  if(W.stage==='done')body=`<h1>You’re set up</h1><p>Your first bundle was sent. You can continue in the gage console.</p><button class="btn go" onclick="document.getElementById('wizard').hidden=true">Open console</button>`;
  el.innerHTML=`<section class="wcard">${body}${W.error?`<div class="werror">${esc(W.error)}</div>`:''}</section>`;
}
async function wCreate(){
  W.busy=true;W.error='';wRender();
  try{const r=await post('/api/init',{handle:W.handle});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||`HTTP ${r.status}`);
    W.handle=j.handle;W.words=Array.isArray(j.words)?j.words:(typeof j.words==='string'?j.words.split('\n'):[]);W.warning=j.backup_warning||'';W.stage='words';
    await inviteLoad(true);
  }catch(e){W.error=e.message||String(e)} W.busy=false;wRender();
}
async function wNearby(){
  W.error='';try{const r=await fetch('/api/nearby');if(!r.ok)throw Error(`HTTP ${r.status}`);const j=await r.json();W.devices=j.devices||[];W.chosen='';W.compared=false;W.stage='pair';}
  catch(e){W.error=e.message||String(e)}wRender();
}
async function wPair(){
  const d=W.devices.find(x=>x.label===W.chosen);if(!d||!W.compared)return;
  W.busy=true;W.error='';wRender();
  try{const r=await post('/api/pair',{label:d.label,name:W.name.trim(),fingerprint:d.fingerprint});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||`HTTP ${r.status}`);W.stage='send';}
  catch(e){W.error=e.message||String(e)}W.busy=false;wRender();
}
function wB64(s){const bytes=new TextEncoder().encode(s);let bin='';for(const b of bytes)bin+=String.fromCharCode(b);return btoa(bin)}
async function wSend(){
  if(!W.message.trim())return;W.busy=true;W.error='';wRender();
  try{const r=await post('/api/send',{to:W.name.trim(),subject:W.subject.trim(),type:'share',files:[{name:'hello.txt',data:wB64(W.message)}]});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||`HTTP ${r.status}`);W.stage='done';}
  catch(e){W.error=e.message||String(e)}W.busy=false;wRender();
}
async function wStart(){try{const r=await fetch('/api/state');if(!r.ok)throw Error(`HTTP ${r.status}`);const s=await r.json();if(s.has_identity===false){document.getElementById('wizard').hidden=false;wRender()}}
  catch(e){/* Existing console loader reports API availability failures. */}}
wStart();

load();setInterval(load,2500);
</script>
