<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>gage</title>
<link rel="icon" href="/favicon.svg">
<style>
/* ---------------------------------------------------------------------------
   Design system.

   The rules below were already disciplined about the thing that matters most
   -- semantic colour is reserved for trust verdicts, so nothing decorative
   can borrow the colour that means "unverified" -- and undisciplined about
   everything else: thirteen font sizes including half-pixels, nine corner
   radii, fifteen arbitrary paddings. That is not a style, it is an accretion,
   and it reads as one.

   So: five type steps, one spacing scale, three radii, three weights. A value
   that is not on a scale is a decision someone has to re-make every time, and
   the eye notices the inconsistency long before anyone can name it.

   No webfont. This page is served under a CSP with no network access and
   loosening that for typography would be a poor trade -- so the system stack
   is tuned instead, with tabular numerals where figures must line up.
--------------------------------------------------------------------------- */
:root{
  /* Type: 11 / 12.5 / 14 / 16 / 20. Five steps, each distinguishable at a
     glance. Anything needing a sixth is a sign the hierarchy is wrong. */
  --t1:11px; --t2:12.5px; --t3:14px; --t4:16px; --t5:20px;
  /* Weight: three. Regular reads, medium orients, semibold names things. */
  --w1:400; --w2:550; --w3:680;
  /* Space: a 4px base. */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  /* Radius: small controls, cards, pills. Three, and a circle is the pill
     taken to its limit rather than a fourth value spelled `50%`. */
  --r1:6px; --r2:10px; --r3:999px;
  --r:var(--r2);
  /* One rail width, fixed. It used to be minmax(348px,clamp(348px,26vw,440px))
     -- three numbers for one column, and the column that grew was the one
     holding the narrowest content on the page. */
  --rail:320px;
  /* One reading measure. There were three: 58ch, 62ch and a 760px column. */
  --measure:62ch;

  --bg:#fbfaf8; --sheet:#ffffff; --sunk:#f3f1ec; --line:#e7e3dc; --line2:#d6d1c7;
  --fg:#191815; --dim:#5b5751; --faint:#8b867d;
  /* Green is reserved. It is the colour of a verdict -- SENDER VERIFIED, a
     paired device, a settled thread -- and nothing a person can merely click
     may borrow it. Until 25 October the interactive accent was a green two
     degrees of hue from --ok (and in dark mode the identical value), so a
     filled Send button and the Verified badge were the same paint: the
     strongest claim this program makes, spent on an invitation to press
     something. The accent is now blue, which asserts nothing, and the
     verdict set keeps the traffic-light hues it has to keep.
     The mark stays green -- see packaging/icon -- because a logo is not a
     claim about a bundle. */
  --accent:#26608f; --accent-ink:#ffffff; --accent-soft:#e5eef6;
  /* The mark's own green, from packaging/icon: the logo is not chrome and
     not a verdict, and it has to go on matching the thing in the dock. */
  --brand:#1D6E47; --brand-ink:#f4f1e8;
  --ok:#2c6650; --warn:#8a5712; --bad:#9a2b2b;
  /* A bundle's kind is a fact about its contents, not a judgement of it, so
     --file is a slate: the same hue family as the accent at a fifth of its
     saturation. It was the accent green, which made a FILE tag read as a
     verified one. */
  --prompt:#8a5712; --memory:#9a2b2b; --decision:#45458a; --file:#5c6672;
  --shadow:0 1px 2px rgba(25,24,21,.04), 0 10px 28px -20px rgba(25,24,21,.30);
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --ease:140ms cubic-bezier(.2,.6,.3,1);
}
/* Dark is not the light palette inverted. The background goes deeper than the
   panels so the panels read as surfaces rather than as holes, and the
   neutrals keep a trace of warmth -- a pure grey dark theme looks clinical,
   which is the wrong register for something whose whole subject is trust. */
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#121316; --sheet:#1b1d21; --sunk:#232529; --line:#2b2e34; --line2:#3a3e45;
  --fg:#edebe7; --dim:#a8a49d; --faint:#7a766f;
  --accent:#8bbce2; --accent-ink:#0c1a26; --accent-soft:#1d2a36;
  --brand:#1D6E47; --brand-ink:#f4f1e8;
  --ok:#86c7b1; --warn:#dcac60; --bad:#e8908a;
  --prompt:#dcac60; --memory:#e8908a; --decision:#a8a8e4; --file:#9aa6b4;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 32px -22px rgba(0,0,0,.9);
  color-scheme:dark;
}}
:root[data-theme=dark]{
  --bg:#121316; --sheet:#1b1d21; --sunk:#232529; --line:#2b2e34; --line2:#3a3e45;
  --fg:#edebe7; --dim:#a8a49d; --faint:#7a766f;
  --accent:#8bbce2; --accent-ink:#0c1a26; --accent-soft:#1d2a36;
  --brand:#1D6E47; --brand-ink:#f4f1e8;
  --ok:#86c7b1; --warn:#dcac60; --bad:#e8908a;
  --prompt:#dcac60; --memory:#e8908a; --decision:#a8a8e4; --file:#9aa6b4;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 32px -22px rgba(0,0,0,.9);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
/* The UA stylesheet gives [hidden] `display:none`, and ANY author rule with a
   `display` beats it -- `.filters{display:flex}` did, so the Chats filter bar
   stayed on screen on the Buddies tab with its `hidden` attribute faithfully
   set. Nothing in the API could show this and no assertion here was wrong;
   the first headless screenshot showed it immediately. */
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);
  font-size:var(--t3);line-height:1.55;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r1)}
/* One micro-label rule, rather than the same four declarations repeated at
   six different sizes. */
.state,.ty,.tag,.verdict,.bsec,.lanhead{font-size:var(--t1);letter-spacing:.07em;
  text-transform:uppercase;font-weight:var(--w3)}

/* One shell, three tabs. The tab bar is a strip across the top rather than a
   block inside the rail, so no tab can take the whole window and leave the
   person with a "<- Conversations" button where the navigation used to be.
   Under it the window is always the same two columns: a narrow rail that
   holds whatever this tab needs kept in view, and a pane that gets every
   remaining pixel.

   Rows: bar, the stale banner (zero-height until there is one), content. */
.app{display:grid;grid-template-columns:var(--rail) 1fr;
  grid-template-rows:auto auto 1fr;height:100dvh}
/* min-width:0 and the wrap because this bar spans both grid columns: its
   min-content width -- brand, three tabs, handle -- otherwise becomes the
   floor for the whole grid, and the panes below inherit a window wider than
   the window. */
.topbar{grid-column:1/-1;grid-row:1;display:flex;align-items:center;gap:var(--s3);
  flex-wrap:wrap;min-width:0;
  padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);background:var(--sheet)}
.stale{grid-column:1/-1;grid-row:2}
.left{grid-column:1;grid-row:3}
.right{grid-column:2;grid-row:3}
@media (max-width:880px){
  .app{grid-template-columns:1fr}
  .left,.right{grid-column:1;grid-row:3}
  .right{display:none}
  .app.detail .left{display:none}
  .app.detail .right{display:flex}
  /* Under 880px the window is one column, so the rail and the pane stack
     instead of sitting side by side. The rail is capped rather than hidden:
     on Buddies it holds the QR, which is the thing this screen exists to
     hand to somebody else. */
  .app.buds{grid-template-rows:auto auto minmax(0,auto) minmax(0,1fr)}
  .app.buds .left{grid-row:3;max-height:48dvh;border-right:0;
    border-bottom:1px solid var(--line)}
  .app.buds .right{grid-row:4;display:flex}
}

/* ---------- rail ---------- */
.left{border-right:1px solid var(--line);background:var(--sheet);
  display:flex;flex-direction:column;min-height:0;min-width:0}
/* The mark, on the same tile the app icon uses, so the thing in the dock and
   the thing at the top of the rail are recognisably one product. Square now
   that it holds a glyph rather than the word. */
.logo{width:var(--s6);height:var(--s6);border-radius:var(--r1);flex:none;
  display:grid;place-items:center;background:var(--brand);color:var(--brand-ink)}
.logo svg{width:var(--s5);height:var(--s5);display:block}
.wordmark{font-weight:var(--w3);font-size:var(--t4);letter-spacing:-.01em}
/* The handle is this machine's own, and the CLI accepts a longer one than
   the wizard's 40 characters. Unclamped it widened the topbar past the
   window and gave the whole page a horizontal scrollbar. */
.whoami{margin-left:auto;text-align:right;min-width:0;max-width:34ch;overflow:hidden}
.whoami .h,.whoami .k{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.whoami .h{font-size:var(--t2);font-weight:var(--w2);color:var(--dim)}
.whoami .k{font-family:var(--mono);font-size:var(--t1);color:var(--faint)}

.tabs{display:flex;gap:var(--s1);margin-left:var(--s4)}
.tab{font-size:var(--t2);padding:var(--s1) var(--s3);border-radius:var(--r3);cursor:pointer;
  border:1px solid transparent;background:transparent;color:var(--dim);display:flex;
  align-items:center;gap:var(--s2);transition:background var(--ease),color var(--ease)}
.tab:hover{background:var(--sunk);color:var(--fg)}
.tab.on{background:var(--accent-soft);border-color:transparent;color:var(--accent);
  font-weight:var(--w2)}
.tab .bdg{font-size:var(--t1);min-width:var(--s4);height:var(--s4);border-radius:var(--r3);
  padding:0 var(--s1);
  display:grid;place-items:center;background:var(--bad);color:#fff;font-weight:var(--w3)}

.filters{display:flex;gap:var(--s1);padding:var(--s4) var(--s4) var(--s3)}
.chip{font-size:var(--t2);padding:var(--s1) var(--s3);border-radius:var(--r3);color:var(--dim);
  border:1px solid transparent;transition:background var(--ease),color var(--ease)}
.chip:hover{background:var(--sunk);color:var(--fg)}
.chip.on{background:var(--accent-soft);color:var(--accent);font-weight:var(--w2)}
.chip .n{font-family:var(--mono);font-size:var(--t1);opacity:.7;margin-left:var(--s1)}

.list{overflow-y:auto;flex:1;min-height:0;padding:0 var(--s3) var(--s4);scrollbar-width:thin}
.t{width:100%;text-align:left;padding:var(--s3);border-radius:var(--r2);
  display:grid;grid-template-columns:auto 1fr;gap:var(--s3);position:relative;
  transition:background var(--ease)}
.t:hover{background:var(--sunk)}
.t.sel{background:var(--accent-soft)}
.t + .t{margin-top:var(--s1)}
.avatar{width:var(--s6);height:var(--s6);border-radius:var(--r1);flex:none;display:grid;
  place-items:center;font-size:var(--t2);font-weight:var(--w3)}
.tbody{min-width:0}
.trow{display:flex;gap:var(--s2);align-items:baseline}
/* Two lines, not one with an ellipsis. Subjects are written by the sender
   and are routinely longer than any rail width, so a single line meant every
   row in the list ended in "..." and the list stopped distinguishing threads. */
.subj{font-weight:var(--w2);font-size:var(--t3);flex:1;letter-spacing:-.005em;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.when{font-family:var(--mono);font-size:var(--t1);color:var(--faint);flex:none}
.tmeta{display:flex;gap:var(--s2);align-items:center;margin-top:var(--s1);font-size:var(--t2);
  color:var(--dim);min-width:0}
.tmeta .peers{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pip{width:var(--s2);height:var(--s2);border-radius:var(--r3);background:var(--accent);flex:none}
.state{padding:var(--s1) var(--s2);border-radius:var(--r1);flex:none;white-space:nowrap}
.s-you{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent)}
.s-them{color:var(--dim);background:var(--sunk)}
.s-settled{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.s-closed{color:var(--faint);background:var(--sunk)}
.empty{padding:var(--s7) var(--s5);color:var(--faint);text-align:center;
  font-size:var(--t2);line-height:1.75}

/* ---------- conversation ---------- */
/* min-width:0 for the same reason as .budwrap: a grid item's automatic
   minimum is its content, so a wide config block widened the column rather
   than scrolling inside it, and the whole page gained a horizontal
   scrollbar. */
.right{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg)}
.head{padding:var(--s4) var(--s5);border-bottom:1px solid var(--line);background:var(--sheet);
  display:flex;gap:var(--s3);align-items:center;flex:none}
.back{display:none;font-size:var(--t4);color:var(--dim);padding:var(--s1) var(--s2)}
@media (max-width:880px){.back{display:block}}
.head h1{font-size:var(--t4);font-weight:var(--w3);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;letter-spacing:-.012em}
.head .sp{flex:1}
.headbtn{font-size:var(--t2);color:var(--dim);padding:var(--s1) var(--s3);border-radius:var(--r1);
  border:1px solid var(--line2);white-space:nowrap;transition:border-color var(--ease),color var(--ease)}
.headbtn:hover{border-color:var(--accent);color:var(--accent)}

.msgs{overflow-y:auto;flex:1;min-height:0;padding:var(--s5) var(--s5) var(--s3);
  display:flex;flex-direction:column;gap:var(--s5)}
/* Centred, not left-aligned against the rail: past about 1200px the column
   kept its measure but all the surplus piled up on the right, which read as
   a broken layout rather than a deliberate one. */
.m{max-width:760px;min-width:0;width:100%;margin-inline:auto}
.m.mine{margin-left:auto}
.mhead{display:flex;gap:var(--s2);align-items:center;margin-bottom:var(--s2);
  flex-wrap:wrap}
.m.mine .mhead{justify-content:flex-end}
.who{font-weight:var(--w3);font-size:var(--t2)}
.ty{padding:var(--s1) var(--s2);border-radius:var(--r1);background:var(--sunk);color:var(--dim)}
.ty.question,.ty.review-request{color:var(--warn)}
.ty.answer{color:var(--ok)}
.at{font-family:var(--mono);font-size:var(--t1);color:var(--faint)}
.dot{width:var(--s2);height:var(--s2);border-radius:var(--r3);background:var(--accent)}

.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r2);
  overflow:hidden;box-shadow:var(--shadow)}
.m.mine .sheet{background:var(--sunk);box-shadow:none}
/* The verdict keeps the weight of a headline. It is the product; a redesign
   that quietly turned it into a caption would be a regression, not a style.
   So it is the one place the micro-label rule is overridden UPWARD. */
.verdict{display:flex;gap:var(--s2);align-items:center;padding:var(--s3) var(--s4);
  font-size:var(--t2);letter-spacing:.06em}
.verdict .vdot{width:var(--s2);height:var(--s2);border-radius:var(--r3);background:currentColor;flex:none}
.v-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.v-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.v-bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.stale{margin:0 var(--s3) var(--s2);padding:var(--s2) var(--s3);border-radius:var(--r1);
  font-size:var(--t2);line-height:1.5;color:var(--bad);
  border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);
  background:color-mix(in srgb,var(--bad) 10%,transparent)}
.alert{padding:var(--s3) var(--s4);font-size:var(--t2);line-height:1.55;color:var(--warn);
  border-top:1px solid var(--line)}
.alert.bad{color:var(--bad)}
.alert b{font-weight:var(--w3)}
.alert code{font-family:var(--mono);font-size:var(--t1)}
.files{border-top:1px solid var(--line);padding:var(--s1) 0}
.f{display:flex;gap:var(--s3);align-items:center;padding:var(--s1) var(--s4);
  font-family:var(--mono);font-size:var(--t1)}
.tag{padding:var(--s1) 0;border-radius:var(--r1);width:calc(var(--s7) + var(--s4));text-align:center;flex:none;
  font-family:var(--sans);background:var(--sunk);letter-spacing:.06em}
.m.mine .tag{background:var(--sheet)}
.t-file{color:var(--file)} .t-prompt{color:var(--prompt)}
.t-memory{color:var(--memory)} .t-decision{color:var(--decision)}
.fp{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fb{color:var(--faint);flex:none}
.acts{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;
  padding:var(--s3) var(--s4);border-top:1px solid var(--line)}
.btn{font-size:var(--t2);padding:var(--s1) var(--s3);border-radius:var(--r1);
  border:1px solid var(--line2);white-space:nowrap;
  transition:border-color var(--ease),color var(--ease),background var(--ease)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);
  font-weight:var(--w2)}
.btn.go:hover{opacity:.88;color:var(--accent-ink)}
.btn.no{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.no:hover{border-color:var(--bad);color:var(--bad)}
.cmd{font-family:var(--mono);font-size:var(--t1);color:var(--faint);margin-left:auto;
  user-select:all;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%}

/* ---------- composer ---------- */
.composer{flex:none;border-top:1px solid var(--line);background:var(--sheet);
  padding:var(--s4) var(--s5)}
.cwrap{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:var(--s2)}
.cto{font-size:var(--t2);color:var(--dim);display:flex;gap:var(--s2);align-items:center;
  flex-wrap:wrap}
.cto b{font-weight:var(--w3);color:var(--fg)}
.cto select{font-size:var(--t2);padding:var(--s1) var(--s2);border-radius:var(--r1);
  border:1px solid var(--line2);background:var(--bg)}
textarea{width:100%;min-height:64px;max-height:40vh;resize:vertical;
  background:var(--bg);border:1px solid var(--line2);border-radius:var(--r2);
  padding:var(--s3);font-size:var(--t3);line-height:1.6;
  transition:border-color var(--ease)}
textarea:focus{outline:none;border-color:var(--accent)}
.crow{display:flex;gap:var(--s3);align-items:center}
.chint{font-size:var(--t1);color:var(--faint)}
.cerr{font-size:var(--t2);color:var(--bad)}
.cblocked{font-size:var(--t2);color:var(--dim);line-height:1.55}

/* ---------- panels: network and buddies ---------- */
.lanbox{border-top:1px solid var(--line);padding:var(--s4) var(--s3) var(--s4);flex:none;
  max-height:46dvh;overflow-y:auto}
.lanhead{display:flex;align-items:center;gap:var(--s2);color:var(--dim);
  margin:0 0 var(--s3) var(--s2)}
.lanhead .dot{width:var(--s2);height:var(--s2);border-radius:var(--r3);background:var(--faint);flex:none}
.lanhead .dot.on{background:var(--ok);box-shadow:0 0 0 var(--s1) color-mix(in srgb,var(--ok) 20%,transparent)}
/* Setup is one column. There is nothing to put beside a checklist, and the
   rail's three jobs -- the thread list, this machine's identity, the agent
   form -- each belong to one of the other tabs. */
.app.solo{grid-template-columns:1fr}
.app.solo .left{display:none}
/* The pane has to move with the column it lives in. Hiding the rail without
   this leaves .right in an implicit second column and the checklist pinned
   to the right half of an otherwise empty window. */
.app.solo .right{grid-column:1}
.setup{max-width:var(--measure);margin-inline:auto;width:100%}
/* The heading sits in the same column as the cards it introduces: .hint
   carries a side padding meant for prose standing alone under a pane. */
.setup > .hint{padding-inline:0;margin-top:0}
/* A step's sentence is prose. .devfp is monospace because what it usually
   holds is a key, and a paragraph set in it reads as output rather than as
   something written to be read. */
.stept{font-size:var(--t2);color:var(--dim);margin-top:var(--s2);line-height:1.65}
.step{display:flex;gap:var(--s3);align-items:flex-start}
.stepn{font-family:var(--mono);font-size:var(--t1);color:var(--faint);
  min-width:2ch;padding-top:.25em}
.stepb{flex:1;min-width:0}
/* A satisfied step recedes. It is still readable, and still states the fact
   that satisfies it, but it has stopped being something to do. */
.dev.done{background:var(--sheet)}
.dev{border:1px solid var(--line);border-radius:var(--r2);padding:var(--s3);
  margin-bottom:var(--s2);background:var(--bg);transition:border-color var(--ease)}
.dev.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
/* A request is the only thing in the panel asking for a decision, so it is
   the only thing that gets a colour. */
.dev.ask{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:var(--sunk)}
.devtop{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap}
.devname{font-weight:var(--w3);font-size:var(--t3);letter-spacing:-.005em}
.devtag{font-size:var(--t1);padding:var(--s1) var(--s2);border-radius:var(--r3);
  border:1px solid var(--line2);color:var(--dim);white-space:nowrap}
.devtag.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
/* Unconfirmed is the ordinary state of a new contact, not an error, so it
   takes the warn colour rather than the bad one -- and never the ok colour,
   which this page reserves for a verdict that has been earned. */
.devtag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
/* Word-pairs are the thing a person compares character by character, so they
   get the monospace face, room to breathe, and no truncation ever. */
.devfp{font-size:var(--t2);color:var(--fg);margin-top:var(--s2);line-height:1.6;
  font-family:var(--mono);word-break:break-word;letter-spacing:-.01em}
.devrow{display:flex;gap:var(--s2);margin-top:var(--s3);flex-wrap:wrap}
.devbtn{font-size:var(--t2);padding:var(--s1) var(--s3);border-radius:var(--r1);cursor:pointer;
  border:1px solid var(--line2);background:transparent;color:var(--fg);
  transition:border-color var(--ease),color var(--ease)}
.devbtn:hover{border-color:var(--accent);color:var(--accent)}
/* A trust decision is not two identical grey boxes. The act that extends
   trust is filled; the one that records a refusal -- which is reversible,
   and withholds nothing that doing nothing does not already withhold -- is
   a quiet button. The fill is the same accent the tabs and the Send button
   already use, and the refusal is neutral rather than red, because red here
   means a verdict. The fill used to be a green a shade off the Verified
   badge's -- in dark mode exactly it -- which is why the palette now keeps
   green for verdicts and paints the accent blue. */
.devbtn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);
  font-weight:var(--w2)}
.devbtn.go:hover{opacity:.88;color:var(--accent-ink);border-color:var(--accent)}
.devbtn.quiet{border-color:transparent;color:var(--dim)}
.devbtn.quiet:hover{border-color:transparent;color:var(--fg);background:var(--sunk)}
/* The armed state of a destructive button. Colour is the only signal that
   changes, and it changes on the button that does the thing rather than on
   the row, so the Cancel beside it stays ordinary. */
.devbtn.danger{border-color:var(--bad);color:var(--bad)}
.devbtn.danger:hover{background:var(--bad);color:#fff;border-color:var(--bad)}
.agkill{align-items:center}
.agkill .lansub{margin-top:0;flex:1 1 220px;min-width:0}
.lansub{font-size:var(--t2);color:var(--dim);margin-top:var(--s2);line-height:1.6}
.lanempty{font-size:var(--t2);color:var(--dim);line-height:1.6;margin-left:var(--s2)}
/* A panel that is switched off says so on one line and gets out of the way;
   the rail's job is the thread list. */
.lanrow{display:flex;align-items:center;gap:var(--s3);margin-left:var(--s2)}
.lanrow .lanempty{margin-left:0;flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.netbox{max-height:none}
.lanin{font:inherit;font-size:var(--t2);padding:var(--s2);border-radius:var(--r1);
  border:1px solid var(--line2);background:var(--bg);color:var(--fg);margin-top:var(--s2);
  transition:border-color var(--ease)}
.lanin:focus{outline:none;border-color:var(--accent)}
.lanerr{font-size:var(--t2);color:var(--bad);margin-top:var(--s2);line-height:1.55}
.lanok{font-size:var(--t2);color:var(--ok);margin-top:var(--s2);line-height:1.55}
.drop{border:1px dashed var(--line2);border-radius:var(--r2);padding:var(--s4) var(--s3);
  text-align:center;font-size:var(--t2);color:var(--dim);cursor:pointer;margin-top:var(--s2);
  transition:border-color var(--ease),background var(--ease)}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop.has{border-style:solid;color:var(--fg)}

/* The rail's tab-dependent half. On Buddies it holds this machine's own
   identity -- the QR and the line that goes with it -- and on Agents the
   form that makes one. Both are the thing you came to the tab to hand to
   somebody; neither is ever below anything. */
.side{padding:var(--s4) var(--s4) var(--s6);overflow-y:auto;flex:1;min-height:0;
  min-width:0}
.side .hint{max-width:none;margin:0 0 var(--s5);padding:0;font-size:var(--t2)}
.side .hint h2{font-size:var(--t3);margin-bottom:var(--s2)}
.side .hint p{margin-bottom:var(--s3)}
.side .invite{margin-top:0}
.side .invite h2{font-size:var(--t3);margin-bottom:var(--s2)}
.side .invite p{font-size:var(--t2);margin-bottom:var(--s3);max-width:none}
.side .bsec:first-child{margin-top:0}
.side .budnote{max-width:none}
/* A disclosure, closed. The sentences are the ones that were always here;
   what changed is that they are no longer standing between a person and the
   decision the page exists for. */
.disc{border-top:1px solid var(--line);margin-top:var(--s4);padding-top:var(--s3)}
.disc > summary{font-size:var(--t2);color:var(--dim);cursor:pointer;
  font-weight:var(--w2);list-style:none}
.disc > summary::-webkit-details-marker{display:none}
.disc > summary::before{content:"\25B8\00a0"}
.disc[open] > summary::before{content:"\25BE\00a0"}
.disc > summary:hover{color:var(--fg)}
.disc .hint{margin-top:var(--s3)}

/* min-width:0 because this is a flex item: without it the item's automatic
   minimum is its content, so one wide <pre> stops scrolling and widens the
   whole page instead. */
.budwrap{width:100%;min-width:0}
.budwrap .dev{min-width:0}
.budgrid{display:grid;gap:var(--s3);
  grid-template-columns:repeat(auto-fill,minmax(336px,1fr));align-items:start}
.budgrid .dev{margin-bottom:0}
/* Agent cards carry a config block that is copied, not read, so they are
   given a wider minimum than a buddy card and still fill the pane. */
.aggrid{grid-template-columns:repeat(auto-fill,minmax(440px,1fr))}
.budnote{max-width:var(--measure)}
.hostpick{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s4)}
.copied{font-size:var(--t2);color:var(--ok)}
.copied.bad{color:var(--warn)}
/* A config block is copied, not read: it keeps its line breaks and scrolls
   rather than wrapping, because a wrapped JSON block invites a bad paste. */
.cfg{font-family:var(--mono);font-size:var(--t2);line-height:1.55;
  background:var(--sunk);border:1px solid var(--line);border-radius:var(--r1);
  padding:var(--s3);margin-top:var(--s2);overflow-x:auto;white-space:pre;
  color:var(--fg)}
.bsec{color:var(--dim);margin:var(--s5) 0 var(--s3) var(--s2);display:flex;
  align-items:baseline;gap:var(--s2)}
.bsec:first-child{margin-top:var(--s3)}
.bsect{color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit}
/* A button that reads as a link because it navigates rather than acts. The
   global reset already strips the chrome; this only adds the underline that
   says it can be clicked. */
.blink{color:var(--accent);text-decoration:underline;padding:0}
.bsect:hover{color:var(--fg)}
.bgate{margin-top:var(--s3);padding-top:var(--s3);border-top:1px dashed var(--line2)}
.bwhy{font-size:var(--t2);color:var(--dim);line-height:1.65;margin-bottom:var(--s2)}
.bdots{display:flex;gap:var(--s3);margin-top:var(--s2);flex-wrap:wrap}
.breach{font-size:var(--t1);color:var(--faint);display:flex;align-items:center;gap:var(--s1)}
.breach.on{color:var(--ok)}
.breach i{width:var(--s1);height:var(--s1);border-radius:var(--r3);background:currentColor;
  display:inline-block;opacity:.5}
.breach.on i{opacity:1}
.bnum{font-size:var(--t1);padding:var(--s1) var(--s2);border-radius:var(--r3);
  background:var(--accent);color:var(--accent-ink);font-weight:var(--w3)}
.berr{font-size:var(--t2);color:var(--bad);margin-top:var(--s3);line-height:1.6}
.bok{font-size:var(--t2);color:var(--ok);margin-top:var(--s3);line-height:1.6}

/* ---------- reading pane prose ---------- */
/* Anchored to the same left edge as the header, not centred in the pane.
   A centred column in a wide empty pane reads as a landing page; aligning it
   with the title above gives the pane a single spine, which is what makes an
   app feel like one surface rather than two. */
/* Centred for the same reason as .m: the empty state is the first thing a
   new person sees, and it was sitting against the rail with the rest of the
   window empty beside it. Inside the buddies page it stays left, under the
   cards it explains. */
.hint{max-width:var(--measure);margin:var(--s6) auto 0;padding:0 var(--s5);color:var(--dim);
  font-size:var(--t3);line-height:1.7}
.hint h2{font-size:var(--t5);font-weight:var(--w3);color:var(--fg);
  letter-spacing:-.022em;margin-bottom:var(--s4)}
.hint p{margin-bottom:var(--s4)}
/* `box-decoration-break:clone` so a command that wraps gets a complete box
   on each line instead of one box torn in half -- which is what a long
   `gage send ...` example did at this column width. */
.hint code{font-family:var(--mono);font-size:var(--t2);background:var(--sunk);
  border:1px solid var(--line);border-radius:var(--r1);padding:var(--s1) var(--s2);
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
/* The QR is black modules on a white field, including in the dark theme.
   `fill` on the element is explicit too; this is the quiet zone around it. */
.invite{margin-top:var(--s5)}
.invite h2{font-size:var(--t4);font-weight:var(--w3);color:var(--fg);margin-bottom:var(--s3)}
.invite p{color:var(--dim);margin-bottom:var(--s4);max-width:var(--measure)}
.invite svg{display:block;width:min(260px,100%);height:auto;background:#fff;
  border:1px solid var(--line);border-radius:var(--r1)}
.wizard{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;
  padding:var(--s5);overflow:auto}
.wcard{width:min(680px,100%);background:var(--sheet);border:1px solid var(--line);
  border-radius:var(--r2);padding:var(--s6);box-shadow:var(--shadow)}
.wcard h1{font-size:var(--t5);margin-bottom:var(--s4)}
.wcard p{color:var(--dim);margin:0 0 var(--s4);max-width:var(--measure)}
.winput{width:100%;padding:var(--s3);border:1px solid var(--line2);border-radius:var(--r1);
  background:var(--bg);margin:0 0 var(--s3)}
.wwords{font-family:var(--mono);font-size:var(--t3);line-height:1.9;white-space:pre-wrap;
  background:var(--sunk);border-radius:var(--r1);padding:var(--s4);margin:var(--s3) 0}
.werror{color:var(--bad);margin:var(--s3) 0}
.wcheck{display:flex;gap:var(--s2);align-items:flex-start;color:var(--dim);margin:var(--s4) 0}
.wcheck input{margin-top:var(--s1)}

/* Four utilities, last so they win, in place of the inline `style="..."`
   attributes that carried widths and margins off every scale this file
   declares. The two that remain compute a colour from a key. */
.wide{width:100%}
.gap{margin-top:var(--s3)}
.note{min-height:var(--s7)}
.bwarn{color:var(--warn)}
</style>

<div class="app" id="app">
  <!-- The tab bar spans the window and belongs to no tab, so no section can
       take the screen and leave the person with a back button where the
       navigation used to be. -->
  <header class="topbar">
    <span class="logo"><svg viewBox="0 0 512 512" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-linecap="round">
        <path d="M 340.85 374.85 A 120 120 0 1 0 171.15 374.85" stroke-width="46"/>
        <path d="M 256 290 L 310.5 212.2" stroke-width="40"/>
      </g><circle cx="256" cy="290" r="23" fill="currentColor"/></svg></span>
    <span class="wordmark" id="wordmark">gage</span>
    <nav class="tabs" id="tabs"></nav>
    <span class="whoami" id="me"></span>
  </header>
  <div class="stale" id="stale" hidden></div>
  <div class="left">
    <div class="filters" id="filters"></div>
    <div class="list" id="list"></div>
    <div class="lanbox" id="lanbox"></div>
    <div class="lanbox netbox" id="netbox"></div>
    <div class="side" id="budside" hidden></div>
  </div>
  <div class="right">
    <div class="head">
      <button class="back" onclick="back()" title="Back">&larr;</button>
      <h1 id="title">Conversations</h1><span class="sp"></span>
      <span id="hstate"></span>
      <button class="headbtn" id="settle" hidden onclick="act('close',SEL)">Mark settled</button>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="composer" id="composer" hidden></div>
    <div class="msgs" id="budpane" hidden></div>
    <div class="msgs" id="setuppane" hidden></div>
  </div>
</div>
<div class="wizard" id="wizard" hidden aria-live="polite"></div>

<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kb=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB';
const ago=iso=>{const d=(Date.now()-Date.parse(iso))/1000;
  if(!isFinite(d))return'';
  if(d<60)return'now'; if(d<3600)return Math.floor(d/60)+'m';
  if(d<86400)return Math.floor(d/3600)+'h'; return Math.floor(d/86400)+'d';};

// Every verdict the tool can produce is listed. The fallback shows the raw
// label rather than the nearest friendly word: an unrecognised trust verdict
// rendered as a recognised one is how a new, worse verdict gets displayed as
// an old, milder one.
const V=[['SENDER VERIFIED','Verified','v-ok'],
         // On your list, and nobody here ever compared its word-pairs. Warn
         // and not ok: every route onto the list except `gage confirm` can be
         // driven by software, so this is the verdict most contacts have, and
         // it must not be allowed to read as the one above it.
         ['SENDER ON YOUR LIST','Unconfirmed','v-warn'],
         ['SENDER NOT','Not on your list','v-warn'],
         // A key you looked at and refused. Warn and not bad: the state is
         // one the person chose, and it withholds nothing that "not on your
         // list" does not already withhold.
         ['SENDER REFUSED','Refused by you','v-warn'],
         ['SENDER KEY RETIRED','Retired key','v-warn'],
         ['SENDER KEY REJECTED','Key rejected','v-bad'],
         ['ARRIVAL UNRECORDED','Arrival unrecorded','v-bad'],
         ['SENDER UNVERIFIABLE','Unverifiable','v-bad'],
         // Not a judgement about a sender -- the absence of one, because the
         // observation step failed. Styled as bad, since the one thing it
         // must never look like is a pass.
         ['VERDICT UNAVAILABLE','Verdict unavailable','v-bad']];
// Per-contact confirm inputs and their errors, keyed by name. Kept out of
// BUD because BUD is replaced wholesale on every poll and half-typed
// word-pairs must survive that.
const CONFW={},CONFE={};
const vRow=t=>V.find(r=>(t||'').startsWith(r[0]));
const vClass=t=>{const r=vRow(t);return r?r[2]:'v-bad';};
const vShort=t=>{const r=vRow(t);return r?r[1]:(t||'No verdict');};
const sClass=s=>s.includes('YOU')?'s-you':s.includes('them')?'s-them':s==='closed'?'s-closed':'s-settled';
const sShort=s=>s.includes('YOU')?'needs you':s;

// A monogram coloured from the KEY, not the name. Two contacts who both call
// themselves "codex" get different marks, so an impersonation shows up as a
// changed colour before anyone reads a word. It is an aid and never a verdict:
// the verdict is always spelled out next to it.
function keyHue(k){let h=0;for(const c of String(k||'')) h=(h*31+c.charCodeAt(0))%360;return h;}
function avatar(m){
  const label=(m.known_as||m.claimed_name||'?').trim()[0]||'?';
  if(m.mine) return `<span class="avatar" style="background:var(--accent);color:var(--accent-ink)">${esc(label.toUpperCase())}</span>`;
  const h=keyHue(m.key||m.known_as||m.claimed_name);
  return `<span class="avatar" style="background:hsl(${h} 42% 88%);color:hsl(${h} 55% 28%)">${esc(label.toUpperCase())}</span>`;
}
const nameOf=m=>m.mine?'you':(m.known_as?m.known_as:`"${m.claimed_name}"`);

let DATA={threads:[],contacts:[]}, LERR='', SEL=null, FILTER='all', DRAFT={}, CERR='', SENDING=false;
let PASTED='', PNAME='', PKEY='', PPAIR=0;

function alerts(m){
  const out=[];
  if(m.tampered&&m.tampered.length) out.push(['bad',
    `Payload does not match the signed manifest (${esc(m.tampered.join(', '))}). Contents withheld.`]);
  if(!m.mine && m.known_as && m.known_as!==m.claimed_name) out.push(['bad',
    `Name mismatch. This key is <b>${esc(m.known_as)}</b> on your list, but the bundle claims "${esc(m.claimed_name)}". The claimed name is text the sender chose.`]);
  if(!m.mine && !m.known_as) out.push(['',
    `This key is not on your list. It claims the name "${esc(m.claimed_name)}", which is unverified.`]);
  if(m.thread_ok===false) out.push(['bad',
    `This message <b>claims</b> to belong to this conversation while answering something you do not hold. The thread field is written by the sender. Treat it as a separate message, and reply to the person you meant.`]);
  if(m.forwarded) out.push(['',`Forwarded, ${m.hops} hop(s). The sender is not the author, and any hop could have altered it before signing.`]);
  if(m.memories) out.push(['bad',
    `${m.memories} memory file(s). Memory outlives the session that accepts it, so it is never merged automatically.`]);
  if(m.prompts) out.push(['',
    `${m.prompts} prompt(s): text written to steer a model. Read it with <code>gage open</code>, which frames it as data.`]);
  return out.map(([c,h])=>`<div class="alert ${c}">${h}</div>`).join('');
}

function msgHtml(m){
  const files=(m.items||[]).map(i=>`<div class="f">
      <span class="tag t-${esc(i.kind)}">${esc(i.kind)}</span>
      <span class="fp">${esc(i.path)}</span><span class="fb">${kb(i.bytes)}</span></div>`).join('');
  const acts = m.stage==='pending'
    ? `<div class="acts">
        <button class="btn go" onclick="act('accept','${esc(m.id)}')">Accept</button>
        <button class="btn no" onclick="act('reject','${esc(m.id)}')">Reject unread</button>
        <span class="cmd">arriving is not accepting</span></div>`
    : m.stage==='accepted'
      ? `<div class="acts">
          ${m.read?'':`<button class="btn" onclick="act('read','${esc(m.id)}')">Mark read</button>`}
          <span class="cmd">gage open ${esc(m.path)}</span></div>`
      : `<div class="acts"><span class="cmd">sent &middot; ${esc(m.id)}</span></div>`;
  return `<div class="m ${m.mine?'mine':''}">
    <div class="mhead">
      ${m.read?'':'<span class="dot"></span>'}
      <span class="who">${esc(nameOf(m))}</span>
      <span class="ty ${esc(m.type)}">${esc(m.type)}</span>
      <span class="at">${esc(m.created)}</span>
    </div>
    <div class="sheet">
      ${m.mine?'':`<div class="verdict ${vClass(m.trust)}"><span class="vdot"></span>${vShort(m.trust)}</div>`}
      ${alerts(m)}
      ${files?`<div class="files">${files}</div>`:''}
      ${acts}
    </div></div>`;
}

const TYPES=['answer','share','question','review-request','ack'];

function composerHtml(t){
  const r=t.reply||{};
  if(!r.can){
    return `<div class="cwrap"><div class="cblocked">
      Cannot reply from here: ${esc(r.why||'no recipient')}.
      ${r.to?`<br><code>gage reply ${esc(t.id)} --text "..."</code>`:''}
    </div></div>`;
  }
  const d=DRAFT[t.id]||{text:'',type:r.type||'answer'};
  return `<div class="cwrap">
    ${CERR?`<div class="cerr">${esc(CERR)}</div>`:''}
    <div class="cto">Reply to <b>${esc(r.to)}</b> as
      <select id="ctype" onchange="draft()">${TYPES.map(x=>
        `<option value="${x}"${x===d.type?' selected':''}>${x}</option>`).join('')}</select>
    </div>
    <textarea id="ctext" placeholder="Write a reply. It is scanned for credentials on the way out, like any file."
      oninput="draft()" onkeydown="ckey(event)">${esc(d.text)}</textarea>
    <div class="crow">
      <span class="chint">Delivered to ${esc(r.to)}'s inbox on this machine. ${SENDING?'Sending...':'&#8984;/Ctrl + Enter to send.'}</span>
      <button class="btn go" onclick="send()" ${SENDING?'disabled':''}>Send reply</button>
    </div></div>`;
}

function render(){
  const me=DATA.me;
  // When the inbox could not be recorded, every verdict in this payload was
  // withheld server-side. Saying why beats leaving the labels to explain
  // themselves.
  // A load failure takes the same banner, and takes it first: with no data
  // there is nothing else on the page to look at.
  const st=document.getElementById('stale');
  if(LERR){ st.hidden=false; st.textContent=LERR; }
  else st.hidden=!DATA.verdicts_stale;
  if(!LERR && DATA.verdicts_stale) st.textContent=
    'Verdicts withheld: your inbox could not be recorded, so a verdict here could read '+
    'milder than the truth. Usually another gage process is writing \u2014 it clears on '+
    'the next poll. Until then, read bundles with gage open in a terminal.';
  document.getElementById('me').innerHTML = me
    ? `<div class="h">${esc(me.handle)}</div><div class="k">${esc((me.key||'').slice(0,10))}&hellip;</div>`
    : `<div class="h">no identity</div><div class="k">run gage init</div>`;
  const th=DATA.threads||[];
  const needYou=th.filter(t=>t.state.includes('YOU')).length;
  const unread=th.reduce((a,t)=>a+t.unread,0);
  document.getElementById('filters').innerHTML=
    [['all','All',th.length],['you','Needs you',needYou],['unread','Unread',unread]]
    .map(([k,l,n])=>`<button class="chip ${FILTER===k?'on':''}" onclick="setF('${k}')">${l}<span class="n">${n}</span></button>`).join('');

  let shown=th;
  if(FILTER==='you') shown=th.filter(t=>t.state.includes('YOU'));
  if(FILTER==='unread') shown=th.filter(t=>t.unread>0);

  document.getElementById('list').innerHTML = shown.length ? shown.map(t=>{
    const last=t.messages[t.messages.length-1]||{};
    const other=[...t.messages].reverse().find(m=>!m.mine)||last;
    const who=[...new Set(t.messages.map(nameOf))].join(', ');
    return `<button class="t ${SEL===t.id?'sel':''}" onclick="sel('${esc(t.id)}')">
      ${avatar(other)}
      <span class="tbody">
        <span class="trow"><span class="subj">${esc(t.subject)}</span>
          <span class="when">${esc(ago(last.created))}</span></span>
        <span class="tmeta">
          ${t.unread?'<span class="pip"></span>':''}
          ${t.correspondents>1?'<span class="state s-you">'+t.correspondents+' senders</span>':''}
          <span class="state ${sClass(t.state)}">${esc(sShort(t.state))}</span>
          <span class="peers">${esc(who)}</span></span>
      </span>
    </button>`;}).join('')

const post=(path,body)=>fetch(path,{method:'POST',headers:

async function act(what,id){

  SENDING=true;CERR='';render();

    const j=await r.json().catch(()=>({}));

async function load(){
  // Never return silently. The first version did, and when the server's own
  // CSP blocked this fetch the result was a blank page: no error, no clue,
  // and nothing in any log. A loader that fails invisibly is worse than one
  // that crashes.
  try{
    const r=await fetch('/api/threads');
    if(!r.ok)throw new Error('HTTP '+r.status);
    DATA=await r.json();
    LERR='';
  }catch(e){
    LERR='Could not load your inbox from this server: '+(e&&e.message?e.message:e)
      +'. The server is at '+location.origin+'; gage ui logs to the terminal it runs in.';
    render();

  render();
}

let LSUBJ='', LNOTE='';

async function lanFiles(fl){
  LERR2='';LOK='';
  const out=[];
  let total=0;
  for(const f of fl){
    total+=f.size;
    // Base64 in JSON inflates by a third, and the server caps the body at
    // 12MB. Refused here with the real number rather than sent and rejected.
    if(total*1.37>11*1024*1024){
      LERR2='That is too much to send through the page ('+kb(total)
        +'). Use gage send --dir in the terminal for anything large.';

  }

  r.onerror=()=>rej(new Error('could not read '+f.name));
  r.onload=()=>res(String(r.result).split(',',2)[1]||'');
  r.readAsDataURL(f);
});

    // the page deliberately offers no override: --allow-findings is a reason
    // to go and look at the file, not a checkbox.
    else { LERR2=j.error||'that did not send'; }

// Pairing happens inline rather than through confirm()/prompt().

// Not only because blocking dialogs are unpleasant: the comparison IS the
// feature, and a browser dialog renders the four pairs in a cramped box the
// person dismisses by reflex. On the page they sit at the size everything
// else is read at, next to the name being filed, and the button says what it
// is agreeing to.
function lanPair(label){ LPAIR=(LPAIR===label?null:label); LNAME=''; LERR2='';LOK=''; lanRender(); }

async function lanPairGo(label){

  if(!LNAME.trim()){ LERR2='Give it a name to file it under.'; lanRender(); return; }
  LBUSY=true;LERR2='';LOK='';lanRender();

    // The fingerprint goes back up so the server can refuse if the list
    // changed under us between showing the words and clicking.
    const r=await post('/api/pair',{label:label,name:LNAME.trim(),fingerprint:d.fingerprint});
    const j=await r.json().catch(()=>({}));
    if(r.ok){ LOK=(j.lines||[]).join('\n'); LPAIR=null; LNAME=''; }
    else { LERR2=j.error||'that did not pair'; }
  }catch(e){ LERR2=String(e); }
  LBUSY=false;
  await lanLoad();
}

async function lanLoad(){
  try{
    const r=await fetch('/api/nearby');
    if(!r.ok)throw new Error('HTTP '+r.status);
    LAN=await r.json();
    if(LSEL&&!LAN.devices.some(d=>d.label===LSEL))LSEL=null;
    // The relay address lives in the same poll rather than a timer of its
    // own: it changes only when somebody presses the switch below it.
    const sr=await fetch('/api/state');
    if(sr.ok){const st=await sr.json();ST=st;RELAY=st.relay||null;
      // The suggested address comes from the binary. The page deliberately
      // contains no URL of any kind -- a test asserts it -- so that nothing
      // in the viewer can point a reader anywhere but this machine.
      if(!RADDR)RADDR=st.relay_default||'';}
  }catch(e){
    // Same rule as the inbox loader: never fail invisibly.
    LERR2='Could not read the network list: '+(e&&e.message?e.message:e);
  }

  netRender();
  if(TAB==='setup')setupRender();
}
lanLoad();setInterval(lanLoad,2000);

// The buddy list
// ---------------------------------------------------------------------------
// Three states for a key, and the panel's whole job is that they look like

// "not yet" makes refusing feel like ignoring, and the way to stop being

let BUD={buddies:[],requests:[],refused:[]}, TAB='chats';

let ST=null;
let AGENTS=null, AGNAME='', AGBUSY=false, AGERR='', AGHOST='claude_code', AGNEW=null;
// Which card has had Remove pressed once. Deleting an identity key is the

let AGKILL='';

const ASKWHY='The word-pairs come from the key itself, so nobody picks their own. '

const ASKHALF='These words cover the SIGNING key only. A message does not carry its '
  +'sender\u2019s encryption key, so adding them here lets you verify what they '

// A sender knows all four pairs of its own key, because they come from that
// key -- so it can write the asked-for pair into the message it sends you,
// and typing it from there satisfies this box and tells you nothing. A
// reviewer put it exactly: the server cannot tell the two sources apart.
const ASKTRAP='If this pair came from the message itself, or from anything this '
  +'key sent you, it proves nothing -- a key knows its own word-pairs and can '

// The add-line QR. Fetched once: it does not change while this page is

let INVITE=null, inviteSeq=0;
function inviteOk(t){
  if(typeof t!=='string'||t.length<20||t.length>200000)return false;
  if(!t.startsWith('<svg ')||!t.endsWith('</svg>'))return false;
  if((t.match(/<svg/g)||[]).length!==1)return false;
  if(/<\s*(script|img|object|embed|iframe|link|foreignObject)\b|<!DOCTYPE|<\?xml/i.test(t))return false;
  return true;
}

  }catch(e){}

  const solo = (t==='setup');

  // showing -- the thread list on Chats, this machine's own identity on
  // Buddies, the form that makes an agent one on Agents.
  for(const [id,show] of [['filters',t==='chats'],['list',t==='chats'],
                          ['lanbox',t==='chats'],['netbox',t==='chats'],['budside',wide],
                          // The right-hand pane belongs to whichever tab is

  // The rail says the product name and keeps saying it; which section you
  // are in is the heading of the section, where a heading belongs.
  const appEl=document.getElementById('app');
  if(appEl)appEl.classList.toggle('buds',wide);
  // Setup has no rail: the column collapses rather than standing empty.
  if(appEl)appEl.classList.toggle('solo',solo);
  // Under 880px the window is one column and `detail` hides the rail so a
  // conversation can have the width. Buddies and Agents keep their controls
  // in that rail, so leaving an open conversation has to clear it -- or the
  // QR, the paste field and the create form are all display:none and the
  // only control left on the pane is the Back arrow. It stays set while a
  // conversation is open on Chats, so coming back lands where you left.
  if(appEl)appEl.classList.toggle('detail', t==='chats' && !!SEL);
  if(t==='agents'){
    document.getElementById('title').textContent='Agents';
    const c=document.getElementById('composer'); if(c)c.hidden=true;
    const se=document.getElementById('settle'); if(se)se.hidden=true;
    document.getElementById('hstate').textContent='';
    agentRender();
    if(AGENTS===null)agentLoad();
  }else if(t==='buddies'){
    document.getElementById('title').textContent='Buddies';
    const c=document.getElementById('composer'); if(c)c.hidden=true;
    const se=document.getElementById('settle'); if(se)se.hidden=true;
    document.getElementById('hstate').textContent='';
    budRender(true);
    if(INVITE===null)inviteLoad(false).then(()=>{if(TAB==='buddies'){
      budRender(true);
    }});
  }else if(t==='setup'){
    document.getElementById('title').textContent='Setup';
    const c=document.getElementById('composer'); if(c)c.hidden=true;
    const se=document.getElementById('settle'); if(se)se.hidden=true;
    document.getElementById('hstate').textContent='';
    // The agent list decides step 2, so this tab needs it even if the Agents
    // tab has never been opened.
    if(AGENTS===null)agentLoad().then(()=>{if(TAB==='setup'){setupRender();tabsRender()}});
    setupRender();
  }else{
    document.getElementById('title').textContent='Conversations';
    // Setup hides the composer and the settle button on its way in. Only
    // render() puts them back, and without this they stayed hidden until the
    // next inbox poll -- up to 2.5s of a conversation with no way to reply.
    render();
  }
  tabsRender(); budRender(true);
}
// The tab, and which decision is open, live in the URL. This page polls and
// re-renders constantly; losing your place on a refresh is the kind of small
// thing that makes a tool feel untrustworthy, and a decision you walked away
// from is exactly the one worth being able to come back to.
function hashSync(){
  let h='';
  if(TAB==='buddies')h = ASK ? '#buddies='+encodeURIComponent(ASK) : '#buddies';
  if(TAB==='agents')h = '#agents';
  if(TAB==='setup')h = '#setup';
  try{ history.replaceState(null,'',h||location.pathname); }catch(e){}
}
function hashRead(){
  const h=decodeURIComponent(location.hash||'');
  if(h==='#agents'){ TAB='agents'; return; }
  if(h==='#setup'){ TAB='setup'; return; }
  if(!h.startsWith('#buddies'))return;
  TAB='buddies';
  const i=h.indexOf('=');
  if(i>0)ASK=h.slice(i+1);
}
function askOpen(k){
  ASK=(ASK===k?null:k); ANAME='';ACONF='';AERR='';AOK='';
  if(!ASK||(REVEAL&&REVEAL.key!==ASK))REVEAL=null;
  hashSync(); budRender(true);
}

async function budReveal(k){
  ABUSY=true;AERR='';AOK='';budRender(true);
  try{
    const r=await fetch('/api/connect',{method:'POST',
      headers:{'X-Gage':'1','Content-Type':'application/json'},
      body:JSON.stringify({key:k,name:'',confirm:ACONF})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
    // The confirmed pair is KEPT, in REVEAL, because the add call has to
    // resend it. The first version cleared ACONF here and then sent ACONF on
    // add, so the add always failed the server's check and the button was
    // dead. The API tests passed because they drove the endpoint directly;
    // only reading the page found it.
    REVEAL={key:k,fp:(j.lines||[])[1]||'',pair:ACONF};
    ACONF='';
  }catch(e){ AERR=(e&&e.message)?e.message:String(e); }
  ABUSY=false; budRender(true);
}

function reachRow(r){
  // Each path says what it knows and no more. `relay` especially: mail can be
  // left there, which is not the same as anybody collecting it, and this
  // panel must not become the presence roster the project has twice refused.
  // No per-contact recency, on purpose: a named list with an "Xs ago" that
  // refreshes is a presence roster whatever it is called, and this project
  // has refused one three times. Each label says what it is evidence of.
  const bits=[
    ['routed under this name', r.routed_by_name,
     'A local route is filed under this name, which is the name sending resolves too. '
     +'It is your label, not their identity.'],
    ['on this network now', r.lan_now,
     'This key is announcing itself on this network, which it chose to do by running '
     +'gage lan. Nothing here polls anybody.'],
    ['mail can be left', r.can_leave_mail,
     'You are joined to a relay and hold an encryption key for them, so mail CAN be '
     +'left. This is about your setup, not about them -- whether they ever collect it '
     +'is not something this machine can know.'],
  ];
  return `<div class="bdots">`+bits.map(([t,on,title])=>
    `<span class="breach${on?' on':''}" title="${esc(title)}"><i></i>${t}</span>`).join('')+`</div>`;
}
