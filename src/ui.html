<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ctx</title>
<style>
  :root{
    --bg:#0b0d11; --panel:#12151c; --card:#171b24; --line:#242a35;
    --fg:#e8eaef; --dim:#8b94a3; --faint:#5a626f;
    --ok:#34d399; --warn:#fbbf24; --bad:#fb7185; --accent:#7dd3fc;
    --prompt:#fbbf24; --memory:#fb7185; --decision:#a78bfa; --file:#60a5fa;
  }
  @media (prefers-color-scheme:light){:root:not([data-theme=dark]){
    --bg:#f6f7f9; --panel:#fff; --card:#fff; --line:#e3e6eb;
    --fg:#111419; --dim:#5a6372; --faint:#8b94a3;
    --ok:#047857; --warn:#a16207; --bad:#be123c; --accent:#0369a1;
    --prompt:#a16207; --memory:#be123c; --decision:#6d28d9; --file:#1d4ed8;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  .top{position:sticky;top:0;z-index:5;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 18px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{font-weight:700;letter-spacing:.14em;font-size:13px}
  .who{font:12px/1.4 ui-monospace,monospace;color:var(--dim)}
  .spacer{flex:1}
  .count{font-size:12px;color:var(--dim)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);
    display:inline-block;margin-right:6px}
  main{display:grid;grid-template-columns:1fr 300px;gap:18px;
    max-width:1180px;margin:0 auto;padding:18px}
  @media (max-width:860px){main{grid-template-columns:1fr}
    aside{order:-1}}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:.1em;
    color:var(--faint);margin:0 0 10px;font-weight:700}
  section{margin-bottom:26px}
  .card{background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:0;margin-bottom:12px;overflow:hidden}
  .card .hd{padding:13px 15px;display:flex;gap:12px;
    justify-content:space-between;align-items:flex-start}
  .subj{font-weight:600;font-size:14.5px;margin:0 0 3px}
  .sub{font:12px/1.5 ui-monospace,monospace;color:var(--dim);word-break:break-all}
  .verdict{font-size:10.5px;font-weight:700;letter-spacing:.06em;
    padding:4px 9px;border-radius:6px;white-space:nowrap;
    border:1px solid currentColor}
  .v-ok{color:var(--ok)} .v-warn{color:var(--warn)} .v-bad{color:var(--bad)}
  .alert{margin:0 15px 11px;padding:9px 11px;border-radius:8px;font-size:12.5px;
    border:1px solid currentColor;display:flex;gap:8px;align-items:flex-start}
  .alert b{font-weight:700}
  .a-bad{color:var(--bad)} .a-warn{color:var(--warn)}
  .files{margin:0 15px 12px;border:1px solid var(--line);border-radius:8px;
    overflow:hidden}
  .f{display:flex;gap:10px;align-items:center;padding:6px 10px;
    font:12px/1.4 ui-monospace,monospace;border-top:1px solid var(--line)}
  .f:first-child{border-top:none}
  .tag{font-size:9.5px;font-weight:700;letter-spacing:.05em;padding:2px 6px;
    border-radius:4px;border:1px solid currentColor;flex:none;width:68px;
    text-align:center}
  .t-file{color:var(--file)} .t-prompt{color:var(--prompt)}
  .t-memory{color:var(--memory)} .t-decision{color:var(--decision)}
  .fp{flex:1;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fb{color:var(--faint);flex:none}
  .acts{padding:11px 15px;border-top:1px solid var(--line);display:flex;gap:9px;
    align-items:center;flex-wrap:wrap}
  button{font:inherit;font-size:13px;padding:7px 14px;border-radius:8px;
    cursor:pointer;border:1px solid var(--line);background:transparent;
    color:var(--fg)}
  button:hover{border-color:var(--accent)}
  button.go{border-color:var(--ok);color:var(--ok);font-weight:600}
  button.no{border-color:var(--bad);color:var(--bad)}
  .cmd{font:11.5px/1.4 ui-monospace,monospace;color:var(--faint);
    margin-left:auto;user-select:all}
  aside .card{padding:13px 15px}
  .peer{display:flex;align-items:center;gap:9px;padding:7px 0;
    border-top:1px solid var(--line)}
  .peer:first-of-type{border-top:none}
  .av{width:26px;height:26px;border-radius:7px;flex:none;display:grid;
    place-items:center;font-size:11px;font-weight:700;
    background:var(--line);color:var(--fg)}
  .pn{flex:1;font-size:13px}
  .pr{font-size:10px;color:var(--faint);font-family:ui-monospace,monospace}
  .empty{color:var(--faint);font-size:13px;padding:14px 2px}
  .thread{font-size:11px;color:var(--faint);font-family:ui-monospace,monospace;
    padding:0 15px 10px}
</style>

<div class="top">
  <span class="logo">CTX</span>
  <span class="who" id="who"></span>
  <span class="spacer"></span>
  <span class="count" id="count"></span>
</div>

<main>
  <div>
    <section><h2 id="ph">Waiting for you</h2><div id="pending"></div></section>
    <section><h2>Accepted</h2><div id="accepted"></div></section>
  </div>
  <aside>
    <section><h2>Agents &amp; people</h2><div id="peers"></div></section>
    <section><h2>Send</h2><div class="card" id="howto"></div></section>
  </aside>
</main>

<script>
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kb = n => n<1024 ? n+' B' : n<1048576 ? (n/1024).toFixed(1)+' KB'
                                            : (n/1048576).toFixed(1)+' MB';
const vclass = t => t.startsWith('SENDER VERIFIED') ? 'v-ok'
  : t.startsWith('SENDER NOT') ? 'v-warn' : 'v-bad';
const vshort = t => t.startsWith('SENDER VERIFIED') ? 'VERIFIED'
  : t.startsWith('SENDER NOT') ? 'NOT ON YOUR LIST' : 'UNVERIFIABLE';
const initials = s => (s||'?').replace(/[^a-z0-9]/gi,'').slice(0,2).toUpperCase();

function alerts(b){
  const out = [];
  if (b.tampered && b.tampered.length) out.push(['a-bad',
    `<b>Altered.</b> The payload does not match the signed manifest
     (${esc(b.tampered.join(', '))}). Contents are withheld by <code>ctx open</code>.`]);
  if (b.known_as && b.known_as !== b.claimed_name) out.push(['a-bad',
    `<b>Name mismatch.</b> This key is <b>${esc(b.known_as)}</b> on your list,
     but the bundle claims to be from “${esc(b.claimed_name)}”. The claimed name
     is just text the sender chose.`]);
  if (!b.known_as) out.push(['a-warn',
    `<b>Not on your list.</b> Signature is valid, but you have never accepted
     this key. It calls itself “${esc(b.claimed_name)}”, which is unverified.`]);
  if (b.forwarded) out.push(['a-warn',
    `<b>Forwarded</b> — ${b.hops} hop(s). The sender is not the author, and any
     hop could have altered it before signing.`]);
  if (b.memories) out.push(['a-bad',
    `<b>${b.memories} memory file(s).</b> Memory outlives the session that
     accepts it, so adopting it is closer to editing your own config than to
     reading a message. Never merged automatically.`]);
  if (b.prompts) out.push(['a-warn',
    `<b>${b.prompts} prompt(s).</b> Text written to steer a model — read it with
     <code>ctx open</code>, which frames it as data.`]);
  return out.map(([c,h]) => `<div class="alert ${c}">${h}</div>`).join('');
}

function card(b, pending){
  const who = b.known_as ? esc(b.known_as) : `“${esc(b.claimed_name)}”`;
  const files = (b.items||[]).map(i => `<div class="f">
      <span class="tag t-${esc(i.kind)}">${esc(i.kind)}</span>
      <span class="fp">${esc(i.path)}</span>
      <span class="fb">${kb(i.bytes)}</span></div>`).join('');
  const thread = b.in_reply_to
    ? `<div class="thread">↳ in reply to ${esc(b.in_reply_to)}</div>` : '';
  const acts = pending
    ? `<div class="acts">
         <button class="go" onclick="act('accept','${esc(b.id)}')">Accept</button>
         <button class="no" onclick="act('reject','${esc(b.id)}')">Reject unread</button>
         <span class="cmd">ctx accept ${esc(b.id)}</span></div>`
    : `<div class="acts"><span class="cmd">ctx open ~/.ctx/inbox/accepted/${esc(b.id)}</span></div>`;
  return `<div class="card">
    <div class="hd"><div>
      <div class="subj">${esc(b.subject)}</div>
      <div class="sub">${who} · ${esc(b.created)} · ${b.items.length} item(s) · ${kb(b.bytes||0)}</div>
    </div><span class="verdict ${vclass(b.trust)}">${vshort(b.trust)}</span></div>
    ${thread}${alerts(b)}
    ${files ? `<div class="files">${files}</div>` : ''}
    ${acts}</div>`;
}

async function act(what, id){
  const r = await fetch(`/api/${what}/${id}`, {method:'POST'});
  if(!r.ok){ const j = await r.json().catch(()=>({})); alert(j.error||'failed'); }
  load();
}

async function load(){
  let s; try { s = await (await fetch('/api/state')).json(); } catch { return; }
  document.getElementById('who').textContent = s.me
    ? `${s.me.handle} · ${s.me.key.slice(0,20)}…` : 'no identity — run ctx init';
  document.getElementById('count').innerHTML =
    `<span class="dot"></span>${s.pending.length} waiting · ${s.accepted.length} accepted`;
  document.getElementById('ph').textContent = `Waiting for you (${s.pending.length})`;
  document.getElementById('pending').innerHTML = s.pending.length
    ? s.pending.map(b=>card(b,true)).join('')
    : '<div class="empty">Nothing waiting. Bundles sent to you land here first — arriving is not accepting.</div>';
  document.getElementById('accepted').innerHTML = s.accepted.length
    ? s.accepted.map(b=>card(b,false)).join('')
    : '<div class="empty">Nothing accepted yet.</div>';
  const peers = (s.contacts||[]).map(c => `<div class="peer">
      <span class="av">${esc(initials(c.name))}</span>
      <span class="pn">${esc(c.name)}<div class="pr">${c.routed?'local · auto-delivers':'no local route'}</div></span>
    </div>`).join('');
  document.getElementById('peers').innerHTML = peers
    ? `<div class="card">${peers}</div>`
    : '<div class="empty">No one yet. <code>ctx add &lt;name&gt; &lt;key&gt;</code></div>';
  const names = (s.contacts||[]).map(c=>c.name);
  const to = names.length ? names[0] : 'codex';
  document.getElementById('howto').innerHTML = `<div class="sub" style="color:var(--dim)">
    <div style="margin-bottom:7px">ctx send --to ${esc(to)} \\<br>
    &nbsp;&nbsp;--subject "..." \\<br>
    &nbsp;&nbsp;--dir ~/Projects/thing \\<br>
    &nbsp;&nbsp;--prompt task.md</div>
    <div style="color:var(--faint)">--dir keeps structure, skips build dirs
    and anything that looks like a secret. --memory for CLAUDE.md / AGENTS.md.
    --reply-to &lt;id&gt; to thread.</div></div>`;
}
load(); setInterval(load, 2500);
</script>
