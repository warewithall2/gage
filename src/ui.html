<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ctx</title>
<style>
:root{
  --bg:#0a0c10; --panel:#0f1218; --raise:#161a22; --line:#232834; --line2:#2d3340;
  --fg:#e9ecf1; --dim:#949db0; --faint:#626b7c;
  --ok:#3ddc97; --warn:#f5b544; --bad:#ff6b81; --accent:#6fb3ff;
  --prompt:#f5b544; --memory:#ff6b81; --decision:#b39bff; --file:#6fb3ff;
  --r:12px;
}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){
  --bg:#f4f6f9; --panel:#fff; --raise:#fff; --line:#e4e8ee; --line2:#d6dbe4;
  --fg:#0f1319; --dim:#59616f; --faint:#8a93a3;
  --ok:#0a8f5b; --warn:#9a6b00; --bad:#c3304a; --accent:#1a6fd4;
  --prompt:#9a6b00; --memory:#c3304a; --decision:#6a4cd6; --file:#1a6fd4;
}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);
  font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

.app{display:grid;grid-template-columns:330px 1fr;height:100dvh}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .right{display:none}
  .app.detail .left{display:none}
  .app.detail .right{display:flex}
}

/* ---- left rail ---- */
.left{border-right:1px solid var(--line);background:var(--panel);
  display:flex;flex-direction:column;min-height:0}
.brand{padding:16px 18px 12px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--line)}
.mark{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--accent),var(--decision));
  color:#fff;font-weight:800;font-size:12px;letter-spacing:.04em}
.brandtxt{font-weight:700;letter-spacing:.14em;font-size:12px}
.me{margin-left:auto;font:11px/1.3 ui-monospace,monospace;color:var(--faint);
  text-align:right;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.filters{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
.chip{font-size:12px;padding:5px 11px;border-radius:999px;color:var(--dim);
  border:1px solid var(--line2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#061018;font-weight:600}
.chip .n{opacity:.75;margin-left:5px}
.list{overflow-y:auto;flex:1;min-height:0}
.t{width:100%;text-align:left;padding:13px 16px;border-bottom:1px solid var(--line);
  display:block;position:relative}
.t:hover{background:var(--raise)}
.t.sel{background:var(--raise);box-shadow:inset 3px 0 0 var(--accent)}
.t .ts{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.t .subj{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.t .when{font:11px ui-monospace,monospace;color:var(--faint);flex:none}
.t .meta{font-size:12px;color:var(--dim);margin-top:3px;display:flex;gap:8px;
  align-items:center;flex-wrap:wrap}
.pip{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.state{font-size:10.5px;letter-spacing:.04em;font-weight:700;padding:2px 7px;
  border-radius:5px;border:1px solid currentColor}
.s-you{color:var(--warn)} .s-them{color:var(--dim)}
.s-settled{color:var(--ok)} .s-closed{color:var(--faint)}
.empty{padding:40px 20px;color:var(--faint);text-align:center;font-size:13px}

/* ---- right pane ---- */
.right{display:flex;flex-direction:column;min-height:0}
.head{padding:16px 22px;border-bottom:1px solid var(--line);background:var(--panel);
  display:flex;gap:12px;align-items:center}
.back{display:none;font-size:18px;color:var(--dim)}
@media (max-width:820px){.back{display:block}}
.head h1{font-size:16px;font-weight:650;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.head .sp{flex:1}
.msgs{overflow-y:auto;flex:1;min-height:0;padding:20px 22px 60px}
.m{margin-bottom:18px;max-width:780px}
.m.mine{margin-left:auto}
.mhead{display:flex;gap:9px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.who{font-weight:650;font-size:13px}
.ty{font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 7px;
  border-radius:5px;border:1px solid currentColor;color:var(--dim)}
.ty.question,.ty.review-request{color:var(--warn)}
.ty.answer{color:var(--ok)}
.when2{font:11px ui-monospace,monospace;color:var(--faint)}
.unread{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.body{background:var(--raise);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden}
.m.mine .body{border-color:var(--line2)}
.verdict{padding:9px 14px;font-size:11.5px;font-weight:650;letter-spacing:.03em;
  border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.v-ok{color:var(--ok)} .v-warn{color:var(--warn)} .v-bad{color:var(--bad)}
.alert{padding:9px 14px;font-size:12.5px;border-bottom:1px solid var(--line);
  color:var(--warn)}
.alert.bad{color:var(--bad)}
.files{padding:4px 0}
.f{display:flex;gap:10px;align-items:center;padding:6px 14px;
  font:12px ui-monospace,monospace}
.tag{font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:2px 6px;
  border-radius:4px;border:1px solid currentColor;width:66px;text-align:center;flex:none}
.t-file{color:var(--file)} .t-prompt{color:var(--prompt)}
.t-memory{color:var(--memory)} .t-decision{color:var(--decision)}
.fp{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fb{color:var(--faint);flex:none}
.acts{display:flex;gap:8px;padding:11px 14px;border-top:1px solid var(--line);
  align-items:center;flex-wrap:wrap}
.btn{font-size:13px;padding:6px 13px;border-radius:8px;border:1px solid var(--line2)}
.btn:hover{border-color:var(--accent)}
.btn.go{border-color:var(--ok);color:var(--ok);font-weight:600}
.btn.no{border-color:var(--bad);color:var(--bad)}
.cmd{font:11.5px ui-monospace,monospace;color:var(--faint);margin-left:auto;
  user-select:all;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:50%}
.hint{padding:30px 22px;color:var(--faint);font-size:13px;max-width:560px}
.hint code{font-family:ui-monospace,monospace;color:var(--dim)}
</style>

<div class="app" id="app">
  <div class="left">
    <div class="brand">
      <span class="mark">C</span><span class="brandtxt">CTX</span>
      <span class="me" id="me"></span>
    </div>
    <div class="filters" id="filters"></div>
    <div class="list" id="list"></div>
  </div>
  <div class="right">
    <div class="head">
      <button class="back" onclick="back()">&larr;</button>
      <h1 id="title">ctx</h1><span class="sp"></span>
      <span id="hstate"></span>
    </div>
    <div class="msgs" id="msgs"></div>
  </div>
</div>

<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kb=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB';
const ago=iso=>{const d=(Date.now()-Date.parse(iso))/1000;
  if(!isFinite(d))return'';
  if(d<60)return'now'; if(d<3600)return Math.floor(d/60)+'m';
  if(d<86400)return Math.floor(d/3600)+'h'; return Math.floor(d/86400)+'d';};
// Every verdict the tool can produce is listed. The fallback shows the raw
// label rather than the nearest friendly word: an unrecognised trust verdict
// rendered as a recognised one is how a new, worse verdict gets displayed as
// an old, milder one.
const V=[['SENDER VERIFIED','VERIFIED','v-ok'],
         ['SENDER NOT','NOT ON YOUR LIST','v-warn'],
         ['SENDER KEY RETIRED','RETIRED KEY','v-warn'],
         ['SENDER KEY REJECTED','KEY REJECTED','v-bad'],
         ['SENDER UNVERIFIABLE','UNVERIFIABLE','v-bad']];
const vRow=t=>V.find(r=>(t||'').startsWith(r[0]));
const vClass=t=>{const r=vRow(t);return r?r[2]:'v-bad';};
const vShort=t=>{const r=vRow(t);return r?r[1]:(t||'NO VERDICT');};
const sClass=s=>s.includes('YOU')?'s-you':s.includes('them')?'s-them':s==='closed'?'s-closed':'s-settled';

let DATA={threads:[],contacts:[]}, SEL=null, FILTER='all';

function nameOf(m){
  if(m.mine) return 'you';
  return m.known_as ? m.known_as : `"${m.claimed_name}"`;
}

function alerts(m){
  const out=[];
  if(m.tampered&&m.tampered.length) out.push(['bad',
    `Payload does not match the signed manifest (${esc(m.tampered.join(', '))}). Contents withheld.`]);
  if(!m.mine && m.known_as && m.known_as!==m.claimed_name) out.push(['bad',
    `Name mismatch — this key is <b>${esc(m.known_as)}</b> on your list but the bundle claims "${esc(m.claimed_name)}".`]);
  if(!m.mine && !m.known_as) out.push(['',
    `Key is not on your list. It claims the name "${esc(m.claimed_name)}", which is unverified.`]);
  if(m.forwarded) out.push(['',`Forwarded — ${m.hops} hop(s). The sender is not the author.`]);
  if(m.memories) out.push(['bad',
    `${m.memories} memory file(s) — memory outlives the session that accepts it. Never merged automatically.`]);
  if(m.prompts) out.push(['',
    `${m.prompts} prompt(s) — text written to steer a model. Read with <code>ctx open</code>, which frames it as data.`]);
  return out.map(([c,h])=>`<div class="alert ${c}">${h}</div>`).join('');
}

function msgHtml(m){
  const files=(m.items||[]).map(i=>`<div class="f">
      <span class="tag t-${esc(i.kind)}">${esc(i.kind)}</span>
      <span class="fp">${esc(i.path)}</span><span class="fb">${kb(i.bytes)}</span></div>`).join('');
  const acts = m.stage==='pending'
    ? `<div class="acts">
        <button class="btn go" onclick="act('accept','${esc(m.id)}')">Accept</button>
        <button class="btn no" onclick="act('reject','${esc(m.id)}')">Reject unread</button>
        <span class="cmd">ctx accept ${esc(m.id)}</span></div>`
    : m.stage==='accepted'
      ? `<div class="acts">
          ${m.read?'':`<button class="btn" onclick="act('read','${esc(m.id)}')">Mark read</button>`}
          <span class="cmd">ctx open ${esc(m.path)}</span></div>`
      : `<div class="acts"><span class="cmd">sent · ${esc(m.id)}</span></div>`;
  return `<div class="m ${m.mine?'mine':''}">
    <div class="mhead">
      ${m.read?'':'<span class="unread"></span>'}
      <span class="who">${esc(nameOf(m))}</span>
      <span class="ty ${esc(m.type)}">${esc(m.type)}</span>
      <span class="when2">${esc(m.created)}</span>
    </div>
    <div class="body">
      ${m.mine?'':`<div class="verdict ${vClass(m.trust)}">${vShort(m.trust)}</div>`}
      ${alerts(m)}
      ${files?`<div class="files">${files}</div>`:''}
      ${acts}
    </div></div>`;
}

function render(){
  const me=DATA.me;
  document.getElementById('me').textContent = me ? me.handle : 'run ctx init';
  const th=DATA.threads||[];
  const needYou=th.filter(t=>t.state.includes('YOU')).length;
  const unread=th.reduce((a,t)=>a+t.unread,0);
  document.getElementById('filters').innerHTML=
    [['all','All',th.length],['you','Needs you',needYou],['unread','Unread',unread]]
    .map(([k,l,n])=>`<button class="chip ${FILTER===k?'on':''}" onclick="setF('${k}')">${l}<span class="n">${n}</span></button>`).join('');

  let shown=th;
  if(FILTER==='you') shown=th.filter(t=>t.state.includes('YOU'));
  if(FILTER==='unread') shown=th.filter(t=>t.unread>0);

  document.getElementById('list').innerHTML = shown.length ? shown.map(t=>{
    const last=t.messages[t.messages.length-1]||{};
    const who=[...new Set(t.messages.map(nameOf))].join(', ');
    return `<button class="t ${SEL===t.id?'sel':''}" onclick="sel('${esc(t.id)}')">
      <div class="ts"><span class="subj">${esc(t.subject)}</span>
        <span class="when">${esc(ago(last.created))}</span></div>
      <div class="meta">
        ${t.unread?'<span class="pip"></span>':''}
        <span class="state ${sClass(t.state)}">${esc(t.state)}</span>
        <span>${t.messages.length} msg${t.messages.length>1?'s':''}</span>
        <span>· ${esc(who)}</span></div>
    </button>`;}).join('')
    : `<div class="empty">Nothing here.<br>Bundles land in <b>pending</b> first — arriving is not accepting.</div>`;

  const t=th.find(x=>x.id===SEL);
  document.getElementById('title').textContent = t ? t.subject : 'ctx';
  document.getElementById('hstate').innerHTML = t
    ? `<span class="state ${sClass(t.state)}">${esc(t.state)}</span>` : '';
  document.getElementById('msgs').innerHTML = t
    ? t.messages.map(msgHtml).join('') +
      (t.state!=='closed'?`<div class="acts" style="border:0;padding-left:0">
         <button class="btn" onclick="act('close','${esc(t.id)}')">Mark settled</button>
         <span class="cmd">ctx send --reply-to ${esc(t.messages[t.messages.length-1].id)} --type answer</span>
       </div>`:'')
    : `<div class="hint">Pick a conversation.<br><br>
        <code>ctx send --to codex --type question --decision q.md</code><br>
        <code>ctx send --reply-to &lt;id&gt; --type answer --decision a.md</code><br><br>
        Read state and thread state are yours — a sender cannot mark their own
        message read in your inbox.</div>`;
}

function setF(f){FILTER=f;render();}
function sel(id){SEL=id;document.getElementById('app').classList.add('detail');render();}
function back(){document.getElementById('app').classList.remove('detail');SEL=null;render();}
async function act(what,id){
  const r=await fetch(`/api/${what}/${id}`,{method:'POST'});
  if(!r.ok){const j=await r.json().catch(()=>({}));alert(j.error||'failed');}
  await load();
}
async function load(){
  try{DATA=await (await fetch('/api/threads')).json();}catch{return;}
  if(SEL&&!DATA.threads.some(t=>t.id===SEL))SEL=null;
  render();
}
load();setInterval(load,2500);
</script>
