<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>gage</title>
<link rel="icon" href="/favicon.svg">
<style>
/* ---------------------------------------------------------------------------
   Design system.

   The rules below were already disciplined about the thing that matters most
   -- semantic colour is reserved for trust verdicts, so nothing decorative
   can borrow the colour that means "unverified" -- and undisciplined about
   everything else: thirteen font sizes including half-pixels, nine corner
   radii, fifteen arbitrary paddings. That is not a style, it is an accretion,
   and it reads as one.

   So: five type steps, one spacing scale, three radii, three weights. A value
   that is not on a scale is a decision someone has to re-make every time, and
   the eye notices the inconsistency long before anyone can name it.

   No webfont. This page is served under a CSP with no network access and
   loosening that for typography would be a poor trade -- so the system stack
   is tuned instead, with tabular numerals where figures must line up.
--------------------------------------------------------------------------- */
:root{
  /* Type: 11 / 12.5 / 14 / 16 / 20. Five steps, each distinguishable at a
     glance. Anything needing a sixth is a sign the hierarchy is wrong. */
  --t1:11px; --t2:12.5px; --t3:14px; --t4:16px; --t5:20px;
  /* Weight: three. Regular reads, medium orients, semibold names things. */
  --w1:400; --w2:550; --w3:680;
  /* Space: a 4px base. */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  /* Radius: small controls, cards, pills. */
  --r1:6px; --r2:10px; --r3:999px;
  --r:var(--r2);

  --bg:#fbfaf8; --sheet:#ffffff; --sunk:#f3f1ec; --line:#e7e3dc; --line2:#d6d1c7;
  --fg:#191815; --dim:#5b5751; --faint:#8b867d;
  --accent:#2c5a4d; --accent-ink:#ffffff; --accent-soft:#e6eee9;
  --ok:#2c6650; --warn:#8a5712; --bad:#9a2b2b;
  --prompt:#8a5712; --memory:#9a2b2b; --decision:#45458a; --file:#2c5a4d;
  --shadow:0 1px 2px rgba(25,24,21,.04), 0 10px 28px -20px rgba(25,24,21,.30);
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --ease:140ms cubic-bezier(.2,.6,.3,1);
}
/* Dark is not the light palette inverted. The background goes deeper than the
   panels so the panels read as surfaces rather than as holes, and the
   neutrals keep a trace of warmth -- a pure grey dark theme looks clinical,
   which is the wrong register for something whose whole subject is trust. */
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#121316; --sheet:#1b1d21; --sunk:#232529; --line:#2b2e34; --line2:#3a3e45;
  --fg:#edebe7; --dim:#a8a49d; --faint:#7a766f;
  --accent:#86c7b1; --accent-ink:#0f1f1a; --accent-soft:#1f2f2a;
  --ok:#86c7b1; --warn:#dcac60; --bad:#e8908a;
  --prompt:#dcac60; --memory:#e8908a; --decision:#a8a8e4; --file:#86c7b1;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 32px -22px rgba(0,0,0,.9);
  color-scheme:dark;
}}
:root[data-theme=dark]{
  --bg:#121316; --sheet:#1b1d21; --sunk:#232529; --line:#2b2e34; --line2:#3a3e45;
  --fg:#edebe7; --dim:#a8a49d; --faint:#7a766f;
  --accent:#86c7b1; --accent-ink:#0f1f1a; --accent-soft:#1f2f2a;
  --ok:#86c7b1; --warn:#dcac60; --bad:#e8908a;
  --prompt:#dcac60; --memory:#e8908a; --decision:#a8a8e4; --file:#86c7b1;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 32px -22px rgba(0,0,0,.9);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
/* The UA stylesheet gives [hidden] `display:none`, and ANY author rule with a
   `display` beats it -- `.filters{display:flex}` did, so the Chats filter bar
   stayed on screen on the Buddies tab with its `hidden` attribute faithfully
   set. Nothing in the API could show this and no assertion here was wrong;
   the first headless screenshot showed it immediately. */
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);
  font-size:var(--t3);line-height:1.55;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r1)}
/* One micro-label rule, rather than the same four declarations repeated at
   six different sizes. */
.state,.ty,.tag,.verdict,.bsec,.lanhead{font-size:var(--t1);letter-spacing:.07em;
  text-transform:uppercase;font-weight:var(--w3)}

/* The rail holds the one thing that truncates -- subject lines -- so it is
   allowed to grow with the window instead of staying at 348px while the
   message column keeps its reading measure and the surplus goes to margin. */
.app{display:grid;grid-template-columns:minmax(348px,clamp(348px,26vw,440px)) 1fr;
  height:100dvh}
/* Buddies is a page, not a sidebar. Every card in it asks a question and
   shows a word-pair that a person compares character by character, and the
   rail was the one column that could not grow -- so the cards were wrapping
   to six lines in 348px while the prose explaining them had the wide pane.
   The tab takes the whole width and lays the cards out in as many columns
   as the window affords. */
.app.buds{grid-template-columns:1fr}
.app.buds .left{display:none}
@media (max-width:880px){
  .app{grid-template-columns:1fr}
  .right{display:none}
  .app.detail .left{display:none}
  .app.detail .right{display:flex}
  /* Buddies hides the rail at every width, and under 880px the pane is
     hidden too unless a thread is open -- which showed an empty window with
     no control to leave it, because the tabs are in the rail and the back
     button is in the pane. Buddies is one pane here, like a thread is. */
  .app.buds .right{display:flex}
}

/* ---------- rail ---------- */
.left{border-right:1px solid var(--line);background:var(--sheet);
  display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:var(--s3);padding:var(--s5) var(--s5) var(--s4)}
/* The mark, on the same tile the app icon uses, so the thing in the dock and
   the thing at the top of the rail are recognisably one product. Square now
   that it holds a glyph rather than the word. */
.logo{width:28px;height:28px;border-radius:8px;flex:none;
  display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.logo svg{width:20px;height:20px;display:block}
.wordmark{font-weight:var(--w3);font-size:var(--t4);letter-spacing:-.01em}
.whoami{margin-left:auto;text-align:right;min-width:0}
.whoami .h{font-size:var(--t2);font-weight:var(--w2);color:var(--dim)}
.whoami .k{font-family:var(--mono);font-size:var(--t1);color:var(--faint)}

.tabs{display:flex;gap:var(--s1);padding:0 var(--s5) var(--s3)}
.tab{font-size:var(--t2);padding:var(--s1) var(--s3);border-radius:var(--r3);cursor:pointer;
  border:1px solid transparent;background:transparent;color:var(--dim);display:flex;
  align-items:center;gap:var(--s2);transition:background var(--ease),color var(--ease)}
.tab:hover{background:var(--sunk);color:var(--fg)}
.tab.on{background:var(--accent-soft);border-color:transparent;color:var(--accent);
  font-weight:var(--w2)}
.tab .bdg{font-size:var(--t1);min-width:17px;height:17px;border-radius:var(--r3);padding:0 5px;
  display:grid;place-items:center;background:var(--bad);color:#fff;font-weight:var(--w3)}

.filters{display:flex;gap:var(--s1);padding:0 var(--s5) var(--s3)}
.chip{font-size:var(--t2);padding:var(--s1) var(--s3);border-radius:var(--r3);color:var(--dim);
  border:1px solid transparent;transition:background var(--ease),color var(--ease)}
.chip:hover{background:var(--sunk);color:var(--fg)}
.chip.on{background:var(--accent-soft);color:var(--accent);font-weight:var(--w2)}
.chip .n{font-family:var(--mono);font-size:var(--t1);opacity:.7;margin-left:var(--s1)}

.list{overflow-y:auto;flex:1;min-height:0;padding:0 var(--s3) var(--s4);scrollbar-width:thin}
.t{width:100%;text-align:left;padding:var(--s3);border-radius:var(--r2);
  display:grid;grid-template-columns:auto 1fr;gap:var(--s3);position:relative;
  transition:background var(--ease)}
.t:hover{background:var(--sunk)}
.t.sel{background:var(--accent-soft)}
.t + .t{margin-top:2px}
.avatar{width:30px;height:30px;border-radius:var(--r1);flex:none;display:grid;
  place-items:center;font-size:var(--t2);font-weight:var(--w3);margin-top:1px}
.tbody{min-width:0}
.trow{display:flex;gap:var(--s2);align-items:baseline}
/* Two lines, not one with an ellipsis. Subjects are written by the sender
   and are routinely longer than any rail width, so a single line meant every
   row in the list ended in "..." and the list stopped distinguishing threads. */
.subj{font-weight:var(--w2);font-size:var(--t3);flex:1;letter-spacing:-.005em;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.when{font-family:var(--mono);font-size:var(--t1);color:var(--faint);flex:none}
.tmeta{display:flex;gap:var(--s2);align-items:center;margin-top:3px;font-size:var(--t2);
  color:var(--dim);min-width:0}
.tmeta .peers{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pip{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.state{padding:2px var(--s2);border-radius:var(--r1);flex:none;white-space:nowrap}
.s-you{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent)}
.s-them{color:var(--dim);background:var(--sunk)}
.s-settled{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.s-closed{color:var(--faint);background:var(--sunk)}
.empty{padding:var(--s7) var(--s5);color:var(--faint);text-align:center;
  font-size:var(--t2);line-height:1.75}

/* ---------- conversation ---------- */
.right{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.head{padding:var(--s4) var(--s5);border-bottom:1px solid var(--line);background:var(--sheet);
  display:flex;gap:var(--s3);align-items:center;flex:none}
.back{display:none;font-size:var(--t4);color:var(--dim);padding:2px var(--s2)}
@media (max-width:880px){.back{display:block}}
.head h1{font-size:var(--t4);font-weight:var(--w3);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;letter-spacing:-.012em}
.head .sp{flex:1}
.headbtn{font-size:var(--t2);color:var(--dim);padding:var(--s1) var(--s3);border-radius:var(--r1);
  border:1px solid var(--line2);white-space:nowrap;transition:border-color var(--ease),color var(--ease)}
.headbtn:hover{border-color:var(--accent);color:var(--accent)}

.msgs{overflow-y:auto;flex:1;min-height:0;padding:var(--s5) var(--s5) var(--s3);
  display:flex;flex-direction:column;gap:var(--s5)}
/* Centred, not left-aligned against the rail: past about 1200px the column
   kept its measure but all the surplus piled up on the right, which read as
   a broken layout rather than a deliberate one. */
.m{max-width:760px;min-width:0;width:100%;margin-inline:auto}
.m.mine{margin-left:auto}
.mhead{display:flex;gap:var(--s2);align-items:center;margin-bottom:var(--s2);
  flex-wrap:wrap;padding-inline:2px}
.m.mine .mhead{justify-content:flex-end}
.who{font-weight:var(--w3);font-size:var(--t2)}
.ty{padding:2px var(--s2);border-radius:var(--r1);background:var(--sunk);color:var(--dim)}
.ty.question,.ty.review-request{color:var(--warn)}
.ty.answer{color:var(--ok)}
.at{font-family:var(--mono);font-size:var(--t1);color:var(--faint)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}

.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r2);
  overflow:hidden;box-shadow:var(--shadow)}
.m.mine .sheet{background:var(--sunk);box-shadow:none}
/* The verdict keeps the weight of a headline. It is the product; a redesign
   that quietly turned it into a caption would be a regression, not a style.
   So it is the one place the micro-label rule is overridden UPWARD. */
.verdict{display:flex;gap:var(--s2);align-items:center;padding:var(--s3) var(--s4);
  font-size:var(--t2);letter-spacing:.06em}
.verdict .vdot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.v-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.v-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.v-bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.stale{margin:0 var(--s3) var(--s2);padding:var(--s2) var(--s3);border-radius:var(--r1);
  font-size:var(--t2);line-height:1.5;color:var(--bad);
  border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);
  background:color-mix(in srgb,var(--bad) 10%,transparent)}
.alert{padding:var(--s3) var(--s4);font-size:var(--t2);line-height:1.55;color:var(--warn);
  border-top:1px solid var(--line)}
.alert.bad{color:var(--bad)}
.alert b{font-weight:var(--w3)}
.alert code{font-family:var(--mono);font-size:var(--t1)}
.files{border-top:1px solid var(--line);padding:var(--s1) 0}
.f{display:flex;gap:var(--s3);align-items:center;padding:var(--s1) var(--s4);
  font-family:var(--mono);font-size:var(--t1)}
.tag{padding:2px 0;border-radius:var(--r1);width:64px;text-align:center;flex:none;
  font-family:var(--sans);background:var(--sunk);letter-spacing:.06em}
.m.mine .tag{background:var(--sheet)}
.t-file{color:var(--file)} .t-prompt{color:var(--prompt)}
.t-memory{color:var(--memory)} .t-decision{color:var(--decision)}
.fp{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fb{color:var(--faint);flex:none}
.acts{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;
  padding:var(--s3) var(--s4);border-top:1px solid var(--line)}
.btn{font-size:var(--t2);padding:var(--s1) var(--s3);border-radius:var(--r1);
  border:1px solid var(--line2);white-space:nowrap;
  transition:border-color var(--ease),color var(--ease),background var(--ease)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);
  font-weight:var(--w2)}
.btn.go:hover{opacity:.88;color:var(--accent-ink)}
.btn.no{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.no:hover{border-color:var(--bad);color:var(--bad)}
.cmd{font-family:var(--mono);font-size:var(--t1);color:var(--faint);margin-left:auto;
  user-select:all;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%}

/* ---------- composer ---------- */
.composer{flex:none;border-top:1px solid var(--line);background:var(--sheet);
  padding:var(--s4) var(--s5)}
.cwrap{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:var(--s2)}
.cto{font-size:var(--t2);color:var(--dim);display:flex;gap:var(--s2);align-items:center;
  flex-wrap:wrap}
.cto b{font-weight:var(--w3);color:var(--fg)}
.cto select{font-size:var(--t2);padding:2px var(--s2);border-radius:var(--r1);
  border:1px solid var(--line2);background:var(--bg)}
textarea{width:100%;min-height:64px;max-height:40vh;resize:vertical;
  background:var(--bg);border:1px solid var(--line2);border-radius:var(--r2);
  padding:var(--s3);font-size:var(--t3);line-height:1.6;
  transition:border-color var(--ease)}
textarea:focus{outline:none;border-color:var(--accent)}
.crow{display:flex;gap:var(--s3);align-items:center}
.chint{font-size:var(--t1);color:var(--faint)}
.cerr{font-size:var(--t2);color:var(--bad)}
.cblocked{font-size:var(--t2);color:var(--dim);line-height:1.55}

/* ---------- panels: network and buddies ---------- */
.lanbox{border-top:1px solid var(--line);padding:var(--s4) var(--s3) var(--s4);flex:none;
  max-height:46dvh;overflow-y:auto}
.lanhead{display:flex;align-items:center;gap:var(--s2);color:var(--dim);
  margin:0 0 var(--s3) var(--s2)}
.lanhead .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.lanhead .dot.on{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent)}
.dev{border:1px solid var(--line);border-radius:var(--r2);padding:var(--s3);
  margin-bottom:var(--s2);background:var(--bg);transition:border-color var(--ease)}
.dev.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
/* A request is the only thing in the panel asking for a decision, so it is
   the only thing that gets a colour. */
.dev.ask{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:var(--sunk)}
.devtop{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap}
.devname{font-weight:var(--w3);font-size:var(--t3);letter-spacing:-.005em}
.devtag{font-size:var(--t1);padding:1px var(--s2);border-radius:var(--r3);
  border:1px solid var(--line2);color:var(--dim);white-space:nowrap}
.devtag.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
/* Word-pairs are the thing a person compares character by character, so they
   get the monospace face, room to breathe, and no truncation ever. */
.devfp{font-size:var(--t2);color:var(--fg);margin-top:var(--s2);line-height:1.6;
  font-family:var(--mono);word-break:break-word;letter-spacing:-.01em}
.devrow{display:flex;gap:var(--s2);margin-top:var(--s3);flex-wrap:wrap}
.devbtn{font-size:var(--t2);padding:var(--s1) var(--s3);border-radius:var(--r1);cursor:pointer;
  border:1px solid var(--line2);background:transparent;color:var(--fg);
  transition:border-color var(--ease),color var(--ease)}
.devbtn:hover{border-color:var(--accent);color:var(--accent)}
.lansub{font-size:var(--t2);color:var(--dim);margin-top:var(--s2);line-height:1.6}
.lanempty{font-size:var(--t2);color:var(--dim);line-height:1.6;margin-left:var(--s2)}
/* A panel that is switched off says so on one line and gets out of the way;
   the rail's job is the thread list. */
.lanrow{display:flex;align-items:center;gap:var(--s3);margin-left:var(--s2)}
.lanrow .lanempty{margin-left:0;flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.netbox{max-height:none}
.lanin{font:inherit;font-size:var(--t2);padding:var(--s2);border-radius:var(--r1);
  border:1px solid var(--line2);background:var(--bg);color:var(--fg);margin-top:var(--s2);
  transition:border-color var(--ease)}
.lanin:focus{outline:none;border-color:var(--accent)}
.lanerr{font-size:var(--t2);color:var(--bad);margin-top:var(--s2);line-height:1.55}
.lanok{font-size:var(--t2);color:var(--ok);margin-top:var(--s2);line-height:1.55}
.drop{border:1.5px dashed var(--line2);border-radius:var(--r2);padding:var(--s4) var(--s3);
  text-align:center;font-size:var(--t2);color:var(--dim);cursor:pointer;margin-top:var(--s2);
  transition:border-color var(--ease),background var(--ease)}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop.has{border-style:solid;color:var(--fg)}

.buddies{padding:0 var(--s3) var(--s5);overflow-y:auto;flex:1}
/* The buddies page. One readable column of prose, and a card grid that fills
   whatever width is left -- a card never narrower than a word-pair needs. */
.budwrap{max-width:1180px;margin-inline:auto;width:100%;padding-bottom:var(--s7)}
.budgrid{display:grid;gap:var(--s3);
  grid-template-columns:repeat(auto-fill,minmax(336px,1fr));align-items:start}
.budgrid .dev{margin-bottom:0}
.budnote{max-width:62ch}
.bsec{color:var(--dim);margin:var(--s5) 0 var(--s3) var(--s2);display:flex;
  align-items:baseline;gap:var(--s2)}
.bsec:first-child{margin-top:var(--s3)}
.bgate{margin-top:var(--s3);padding-top:var(--s3);border-top:1px dashed var(--line2)}
.bwhy{font-size:var(--t2);color:var(--dim);line-height:1.65;margin-bottom:var(--s2)}
.bpair{font-family:var(--mono);font-size:var(--t2);color:var(--fg);background:var(--sunk);
  border:1px solid var(--line);border-radius:var(--r1);padding:1px var(--s2)}
.bdots{display:flex;gap:var(--s3);margin-top:var(--s2);flex-wrap:wrap}
.breach{font-size:var(--t1);color:var(--faint);display:flex;align-items:center;gap:5px}
.breach.on{color:var(--ok)}
.breach i{width:6px;height:6px;border-radius:50%;background:currentColor;
  display:inline-block;opacity:.5}
.breach.on i{opacity:1}
.bnum{font-size:var(--t1);padding:1px var(--s2);border-radius:var(--r3);
  background:var(--accent);color:var(--accent-ink);font-weight:var(--w3)}
.berr{font-size:var(--t2);color:var(--bad);margin-top:var(--s3);line-height:1.6}
.bok{font-size:var(--t2);color:var(--ok);margin-top:var(--s3);line-height:1.6}

/* ---------- reading pane prose ---------- */
/* Anchored to the same left edge as the header, not centred in the pane.
   A centred column in a wide empty pane reads as a landing page; aligning it
   with the title above gives the pane a single spine, which is what makes an
   app feel like one surface rather than two. */
/* Centred for the same reason as .m: the empty state is the first thing a
   new person sees, and it was sitting against the rail with the rest of the
   window empty beside it. Inside the buddies page it stays left, under the
   cards it explains. */
.hint{max-width:58ch;margin:var(--s6) auto 0;padding:0 var(--s5);color:var(--dim);
  font-size:var(--t3);line-height:1.7}
.budwrap .hint{margin-inline:0}
.hint h2{font-size:var(--t5);font-weight:var(--w3);color:var(--fg);
  letter-spacing:-.022em;margin-bottom:var(--s4)}
.hint p{margin-bottom:var(--s4)}
/* `box-decoration-break:clone` so a command that wraps gets a complete box
   on each line instead of one box torn in half -- which is what a long
   `gage send ...` example did at this column width. */
.hint code{font-family:var(--mono);font-size:var(--t2);background:var(--sunk);
  border:1px solid var(--line);border-radius:var(--r1);padding:2px 6px;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
/* The QR is black modules on a white field, including in the dark theme.
   `fill` on the element is explicit too; this is the quiet zone around it. */
.invite{margin-top:var(--s5)}
.invite h2{font-size:var(--t4);font-weight:var(--w3);color:var(--fg);margin-bottom:var(--s3)}
.invite p{color:var(--dim);margin-bottom:var(--s4);max-width:58ch}
.invite svg{display:block;width:min(260px,100%);height:auto;background:#fff;
  border:1px solid var(--line);border-radius:var(--r1)}
.wizard{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;
  padding:var(--s5);overflow:auto}
.wcard{width:min(680px,100%);background:var(--sheet);border:1px solid var(--line);
  border-radius:var(--r2);padding:clamp(20px,5vw,40px);box-shadow:var(--shadow)}
.wcard h1{font-size:var(--t5);margin-bottom:var(--s4)}
.wcard p{color:var(--dim);margin:0 0 var(--s4);max-width:62ch}
.winput{width:100%;padding:var(--s3);border:1px solid var(--line2);border-radius:var(--r1);
  background:var(--bg);margin:0 0 var(--s3)}
.wwords{font-family:var(--mono);font-size:var(--t3);line-height:1.9;white-space:pre-wrap;
  background:var(--sunk);border-radius:var(--r1);padding:var(--s4);margin:var(--s3) 0}
.werror{color:var(--bad);margin:var(--s3) 0}
.wcheck{display:flex;gap:var(--s2);align-items:flex-start;color:var(--dim);margin:var(--s4) 0}
.wcheck input{margin-top:5px}
</style>

<div class="app" id="app">
  <div class="left">
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 512 512" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-linecap="round">
          <path d="M 340.85 374.85 A 120 120 0 1 0 171.15 374.85" stroke-width="46"/>
          <path d="M 256 290 L 310.5 212.2" stroke-width="40"/>
        </g><circle cx="256" cy="290" r="23" fill="currentColor"/></svg></span>
      <span class="wordmark" id="wordmark">gage</span>
      <span class="whoami" id="me"></span>
    </div>
    <div class="stale" id="stale" hidden></div>
    <div class="tabs" id="tabs"></div>
    <div class="filters" id="filters"></div>
    <div class="list" id="list"></div>
    <div class="lanbox" id="lanbox"></div>
    <div class="lanbox netbox" id="netbox"></div>
    <div class="buddies" id="buddies" hidden></div>
  </div>
  <div class="right">
    <div class="head">
      <button class="back" onclick="back()" title="Back">&larr;</button>
      <!-- Buddies takes the whole width, which hides the rail -- and the rail
           is where the tabs live. Without this there is no way back to the
           conversations from the page you just opened. -->
      <button class="headbtn budback" id="budback" hidden
        onclick="setTab('chats')">&larr; Conversations</button>
      <h1 id="title">Conversations</h1><span class="sp"></span>
      <span id="hstate"></span>
      <button class="headbtn" id="settle" hidden onclick="act('close',SEL)">Mark settled</button>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="composer" id="composer" hidden></div>
    <div class="msgs" id="budpane" hidden></div>
  </div>
</div>
<div class="wizard" id="wizard" hidden aria-live="polite"></div>

<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kb=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB';
const ago=iso=>{const d=(Date.now()-Date.parse(iso))/1000;
  if(!isFinite(d))return'';
  if(d<60)return'now'; if(d<3600)return Math.floor(d/60)+'m';
  if(d<86400)return Math.floor(d/3600)+'h'; return Math.floor(d/86400)+'d';};

// Every verdict the tool can produce is listed. The fallback shows the raw
// label rather than the nearest friendly word: an unrecognised trust verdict
// rendered as a recognised one is how a new, worse verdict gets displayed as
// an old, milder one.
const V=[['SENDER VERIFIED','Verified','v-ok'],
         ['SENDER NOT','Not on your list','v-warn'],
         // A key you looked at and refused. Warn and not bad: the state is
         // one the person chose, and it withholds nothing that "not on your
         // list" does not already withhold.
         ['SENDER REFUSED','Refused by you','v-warn'],
         ['SENDER KEY RETIRED','Retired key','v-warn'],
         ['SENDER KEY REJECTED','Key rejected','v-bad'],
         ['ARRIVAL UNRECORDED','Arrival unrecorded','v-bad'],
         ['SENDER UNVERIFIABLE','Unverifiable','v-bad'],
         // Not a judgement about a sender -- the absence of one, because the
         // observation step failed. Styled as bad, since the one thing it
         // must never look like is a pass.
         ['VERDICT UNAVAILABLE','Verdict unavailable','v-bad']];
const vRow=t=>V.find(r=>(t||'').startsWith(r[0]));
const vClass=t=>{const r=vRow(t);return r?r[2]:'v-bad';};
const vShort=t=>{const r=vRow(t);return r?r[1]:(t||'No verdict');};
const sClass=s=>s.includes('YOU')?'s-you':s.includes('them')?'s-them':s==='closed'?'s-closed':'s-settled';
const sShort=s=>s.includes('YOU')?'needs you':s;

// A monogram coloured from the KEY, not the name. Two contacts who both call
// themselves "codex" get different marks, so an impersonation shows up as a
// changed colour before anyone reads a word. It is an aid and never a verdict:
// the verdict is always spelled out next to it.
function keyHue(k){let h=0;for(const c of String(k||'')) h=(h*31+c.charCodeAt(0))%360;return h;}
function avatar(m){
  const label=(m.known_as||m.claimed_name||'?').trim()[0]||'?';
  if(m.mine) return `<span class="avatar" style="background:var(--accent);color:var(--accent-ink)">${esc(label.toUpperCase())}</span>`;
  const h=keyHue(m.key||m.known_as||m.claimed_name);
  return `<span class="avatar" style="background:hsl(${h} 42% 88%);color:hsl(${h} 55% 28%)">${esc(label.toUpperCase())}</span>`;
}
const nameOf=m=>m.mine?'you':(m.known_as?m.known_as:`"${m.claimed_name}"`);

let DATA={threads:[],contacts:[]}, LERR='', SEL=null, FILTER='all', DRAFT={}, CERR='', SENDING=false;
let PASTED='', PNAME='', PKEY='', PPAIR=0, PCONF='', PREVEAL=null;

function alerts(m){
  const out=[];
  if(m.tampered&&m.tampered.length) out.push(['bad',
    `Payload does not match the signed manifest (${esc(m.tampered.join(', '))}). Contents withheld.`]);
  if(!m.mine && m.known_as && m.known_as!==m.claimed_name) out.push(['bad',
    `Name mismatch. This key is <b>${esc(m.known_as)}</b> on your list, but the bundle claims "${esc(m.claimed_name)}". The claimed name is text the sender chose.`]);
  if(!m.mine && !m.known_as) out.push(['',
    `This key is not on your list. It claims the name "${esc(m.claimed_name)}", which is unverified.`]);
  if(m.thread_ok===false) out.push(['bad',
    `This message <b>claims</b> to belong to this conversation while answering something you do not hold. The thread field is written by the sender. Treat it as a separate message, and reply to the person you meant.`]);
  if(m.forwarded) out.push(['',`Forwarded, ${m.hops} hop(s). The sender is not the author, and any hop could have altered it before signing.`]);
  if(m.memories) out.push(['bad',
    `${m.memories} memory file(s). Memory outlives the session that accepts it, so it is never merged automatically.`]);
  if(m.prompts) out.push(['',
    `${m.prompts} prompt(s): text written to steer a model. Read it with <code>gage open</code>, which frames it as data.`]);
  return out.map(([c,h])=>`<div class="alert ${c}">${h}</div>`).join('');
}

function msgHtml(m){
  const files=(m.items||[]).map(i=>`<div class="f">
      <span class="tag t-${esc(i.kind)}">${esc(i.kind)}</span>
      <span class="fp">${esc(i.path)}</span><span class="fb">${kb(i.bytes)}</span></div>`).join('');
  const acts = m.stage==='pending'
    ? `<div class="acts">
        <button class="btn go" onclick="act('accept','${esc(m.id)}')">Accept</button>
        <button class="btn no" onclick="act('reject','${esc(m.id)}')">Reject unread</button>
        <span class="cmd">arriving is not accepting</span></div>`
    : m.stage==='accepted'
      ? `<div class="acts">
          ${m.read?'':`<button class="btn" onclick="act('read','${esc(m.id)}')">Mark read</button>`}
          <span class="cmd">gage open ${esc(m.path)}</span></div>`
      : `<div class="acts"><span class="cmd">sent &middot; ${esc(m.id)}</span></div>`;
  return `<div class="m ${m.mine?'mine':''}">
    <div class="mhead">
      ${m.read?'':'<span class="dot"></span>'}
      <span class="who">${esc(nameOf(m))}</span>
      <span class="ty ${esc(m.type)}">${esc(m.type)}</span>
      <span class="at">${esc(m.created)}</span>
    </div>
    <div class="sheet">
      ${m.mine?'':`<div class="verdict ${vClass(m.trust)}"><span class="vdot"></span>${vShort(m.trust)}</div>`}
      ${alerts(m)}
      ${files?`<div class="files">${files}</div>`:''}
      ${acts}
    </div></div>`;
}

const TYPES=['answer','share','question','review-request','ack'];

function composerHtml(t){
  const r=t.reply||{};
  if(!r.can){
    return `<div class="cwrap"><div class="cblocked">
      Cannot reply from here: ${esc(r.why||'no recipient')}.
      ${r.to?`<br><code>gage reply ${esc(t.id)} --text "..."</code>`:''}
    </div></div>`;
  }
  const d=DRAFT[t.id]||{text:'',type:r.type||'answer'};
  return `<div class="cwrap">
    ${CERR?`<div class="cerr">${esc(CERR)}</div>`:''}
    <div class="cto">Reply to <b>${esc(r.to)}</b> as
      <select id="ctype" onchange="draft()">${TYPES.map(x=>
        `<option value="${x}"${x===d.type?' selected':''}>${x}</option>`).join('')}</select>
    </div>
    <textarea id="ctext" placeholder="Write a reply. It is scanned for credentials on the way out, like any file."
      oninput="draft()" onkeydown="ckey(event)">${esc(d.text)}</textarea>
    <div class="crow">
      <span class="chint">Delivered to ${esc(r.to)}'s inbox on this machine. ${SENDING?'Sending...':'&#8984;/Ctrl + Enter to send.'}</span>
      <button class="btn go" onclick="send()" ${SENDING?'disabled':''}>Send reply</button>
    </div></div>`;
}

function render(){
  const me=DATA.me;
  // When the inbox could not be recorded, every verdict in this payload was
  // withheld server-side. Saying why beats leaving the labels to explain
  // themselves.
  // A load failure takes the same banner, and takes it first: with no data
  // there is nothing else on the page to look at.
  const st=document.getElementById('stale');
  if(LERR){ st.hidden=false; st.textContent=LERR; }
  else st.hidden=!DATA.verdicts_stale;
  if(!LERR && DATA.verdicts_stale) st.textContent=
    'Verdicts withheld: your inbox could not be recorded, so a verdict here could read '+
    'milder than the truth. Usually another gage process is writing \u2014 it clears on '+
    'the next poll. Until then, read bundles with gage open in a terminal.';
  document.getElementById('me').innerHTML = me
    ? `<div class="h">${esc(me.handle)}</div><div class="k">${esc((me.key||'').slice(0,10))}&hellip;</div>`
    : `<div class="h">no identity</div><div class="k">run gage init</div>`;
  const th=DATA.threads||[];
  const needYou=th.filter(t=>t.state.includes('YOU')).length;
  const unread=th.reduce((a,t)=>a+t.unread,0);
  document.getElementById('filters').innerHTML=
    [['all','All',th.length],['you','Needs you',needYou],['unread','Unread',unread]]
    .map(([k,l,n])=>`<button class="chip ${FILTER===k?'on':''}" onclick="setF('${k}')">${l}<span class="n">${n}</span></button>`).join('');

  let shown=th;
  if(FILTER==='you') shown=th.filter(t=>t.state.includes('YOU'));
  if(FILTER==='unread') shown=th.filter(t=>t.unread>0);

  document.getElementById('list').innerHTML = shown.length ? shown.map(t=>{
    const last=t.messages[t.messages.length-1]||{};
    const other=[...t.messages].reverse().find(m=>!m.mine)||last;
    const who=[...new Set(t.messages.map(nameOf))].join(', ');
    return `<button class="t ${SEL===t.id?'sel':''}" onclick="sel('${esc(t.id)}')">
      ${avatar(other)}
      <span class="tbody">
        <span class="trow"><span class="subj">${esc(t.subject)}</span>
          <span class="when">${esc(ago(last.created))}</span></span>
        <span class="tmeta">
          ${t.unread?'<span class="pip"></span>':''}
          ${t.correspondents>1?'<span class="state s-you">'+t.correspondents+' senders</span>':''}
          <span class="state ${sClass(t.state)}">${esc(sShort(t.state))}</span>
          <span class="peers">${esc(who)}</span></span>
      </span>
    </button>`;}).join('')
    : `<div class="empty">No bundles yet. Pair on this network, then ask your buddy to send you one.</div>`;

  // The right-hand pane and the header belong to whichever tab is showing.
  // This runs on every poll, so without the guard it reinstated the Chats
  // header two and a half seconds after `setTab` set the other one.
  if(TAB!=='chats') return;
  const t=th.find(x=>x.id===SEL);
  document.getElementById('title').textContent = t ? t.subject : 'Conversations';
  document.getElementById('hstate').innerHTML = t
    ? `<span class="state ${sClass(t.state)}">${esc(sShort(t.state))}</span>` : '';
  document.getElementById('settle').hidden = !t || t.state==='closed';
  const comp=document.getElementById('composer');
  comp.hidden = !t;
  document.getElementById('msgs').innerHTML = t
    ? t.messages.map(msgHtml).join('')
    : `<div class="hint">
        <h2>Pick a conversation</h2>
        <p>Threads group by the message that started them. What is read, and what
           counts as settled, is yours: a sender cannot mark their own message
           read in your inbox.</p>
        <p><code>gage send --to codex --type question --decision q.md</code><br>
           <code>gage reply &lt;id&gt; --text "..."</code></p>
        <p>Replies written here are delivered to a local route. Files you drop
           on a machine in <b>On this network</b> go straight to it, over the
           wifi, and land unread in its inbox. Sending through a <i>relay</i> is
           still <code>gage push</code> in a terminal, where you see the list
           first.</p>
      </div>`;
  if(t){
    const prev=document.activeElement&&document.activeElement.id;
    const caret=prev==='ctext'?document.activeElement.selectionStart:null;
    comp.innerHTML=composerHtml(t);
    if(prev==='ctext'){
      const el=document.getElementById('ctext');
      if(el){el.focus();if(caret!=null)el.setSelectionRange(caret,caret);}
    }
  }
}

function setF(f){FILTER=f;render();}
function sel(id){SEL=id;CERR='';document.getElementById('app').classList.add('detail');render();
  const m=document.getElementById('msgs');if(m)m.scrollTop=m.scrollHeight;}
function back(){document.getElementById('app').classList.remove('detail');SEL=null;render();}
function draft(){
  const te=document.getElementById('ctext'), ty=document.getElementById('ctype');
  if(SEL) DRAFT[SEL]={text:te?te.value:'',type:ty?ty.value:'answer'};
}
function ckey(e){ if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();send();} }

// The custom header is the point: a cross-site form cannot set one, and a
// cross-site fetch that tries must first pass a preflight the server does not
// answer. Without it, any page you visited could act on your inbox.
const post=(path,body)=>fetch(path,{method:'POST',headers:
  Object.assign({'X-Gage':'1'},body?{'Content-Type':'application/json'}:{}),
  body:body?JSON.stringify(body):undefined});

async function act(what,id){
  if(!id)return;
  const r=await post(`/api/${what}/${id}`);
  if(!r.ok){const j=await r.json().catch(()=>({}));CERR=j.error||'that did not work';}
  await load();
}
async function send(){
  draft();
  const d=DRAFT[SEL]; if(!d||!d.text.trim()||SENDING) return;
  SENDING=true;CERR='';render();
  try{
    const r=await post('/api/reply',{thread:SEL,text:d.text,type:d.type});
    const j=await r.json().catch(()=>({}));
    if(r.ok){ DRAFT[SEL]={text:'',type:d.type}; }
    else { CERR=j.error||'the reply was not sent'; }
  }catch(e){ CERR=String(e); }
  SENDING=false;
  await load();
}
async function load(){
  // Never return silently. The first version did, and when the server's own
  // CSP blocked this fetch the result was a blank page: no error, no clue,
  // and nothing in any log. A loader that fails invisibly is worse than one
  // that crashes.
  try{
    const r=await fetch('/api/threads');
    if(!r.ok)throw new Error('HTTP '+r.status);
    DATA=await r.json();
    LERR='';
  }catch(e){
    LERR='Could not load your inbox from this server: '+(e&&e.message?e.message:e)
      +'. The server is at '+location.origin+'; gage ui logs to the terminal it runs in.';
    render();
    return;
  }
  if(SEL&&!DATA.threads.some(t=>t.id===SEL))SEL=null;
  render();
}
// ---------------------------------------------------------------------------
// On this network
// ---------------------------------------------------------------------------
// The page never announces. It reads the list `gage lan` keeps, so the viewer
// cannot make a machine visible that the person did not choose to make
// visible -- which would be the one thing a button here must not be able to
// do.
let LAN={lan_running:false,devices:[]}, LSEL=null, FILES=[], LERR2='', LOK='', LBUSY=false;
// The relay the machine is joined to, or null. Polled with the device list.
let RELAY=null, RADDR='', RBUSY=false, RERR='', ROK='', RSHOW=false;
let LPAIR=null, LNAME='';

const PAIRHINT='Check all four pairs against what the other machine shows. They come '
  +'from its key, so nobody picks their own. If one word differs, it is not that key.';

function netRender(){
  const box=document.getElementById('netbox');
  if(!box)return;
  const on=!!RELAY;
  let h=`<div class="lanhead"><span class="dot${on?' on':''}"></span>Over the internet</div>`;
  if(on){
    h+=`<div class="lanrow"><span class="lanempty">${esc(RELAY)}</span>
        <button class="devbtn" onclick="relayOff()" ${RBUSY?'disabled':''}>
          ${RBUSY?'Working...':'Turn off'}</button></div>`;
  }else if(!RSHOW){
    // One line when it is off. Two panels in the rail, each explaining
    // itself at length, left three threads visible in a 760px-tall window.
    // The explanation belongs on the screen where you switch it on.
    h+=`<div class="lanrow"><span class="lanempty">Off</span>
        <button class="devbtn" onclick="RSHOW=true;netRender()">Turn on</button></div>`;
  }else{
    h+=`<div class="lansub">The address of the relay to use. It has to be an
        <b>https</b> address: this crosses networks nobody here controls, and
        without that there is nothing to say the relay is the relay.</div>
      <input class="lanin" style="width:100%" aria-label="Relay address"
        value="${esc(RADDR)}" oninput="RADDR=this.value"
        onkeydown="if(event.key==='Enter')relayOn()">
      <div class="devrow">
        <button class="devbtn" onclick="relayOn()" ${RBUSY?'disabled':''}>
          ${RBUSY?'Registering...':'Register'}</button>
        <button class="devbtn" onclick="RSHOW=false;RERR='';netRender()">Cancel</button>
      </div>`;
  }
  if(RERR)h+=`<div class="lanerr">${esc(RERR)}</div>`;
  if(ROK)h+=`<div class="lanok">${esc(ROK)}</div>`;
  box.innerHTML=h;
}

async function relayPost(body){
  RBUSY=true;RERR='';ROK='';netRender();
  try{
    const r=await fetch('/api/relay',{method:'POST',
      headers:{'X-Gage':'1','Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
    ROK=(j.lines||[]).join(' ');
    RSHOW=false;
  }catch(e){ RERR=(e&&e.message)?e.message:String(e); }
  RBUSY=false; await lanLoad();
}
function relayOn(){ return relayPost({addr:RADDR}); }
function relayOff(){ return relayPost({off:true}); }

function lanRender(){
  const box=document.getElementById('lanbox');
  if(!box)return;
  const on=LAN.lan_running;
  let h=`<div class="lanhead"><span class="dot${on?' on':''}"></span>On this network</div>`;
  if(!LAN.devices.length){
    // One line, for the same reason as the panel below it: the rail is for
    // the thread list, and two panels each writing a paragraph about an
    // empty state left four threads visible in the window the app opens at.
    h+=`<div class="lanempty">${on
      ? 'Nobody else here yet. Run <b>gage lan</b> on the other machine too.'
      : 'Off. Run <b>gage lan</b> in a terminal.'}</div>`;
    box.innerHTML=h; return;
  }
  for(const d of LAN.devices){
    const sel=LSEL===d.label;
    h+=`<div class="dev${sel?' sel':''}">
      <div class="devtop">
        <span class="devname">${esc(d.paired_as||d.label)}</span>
        ${d.paired_as
          ? `<span class="devtag ok">paired</span>`
          : `<span class="devtag">not paired</span>`}
      </div>
      <div class="devfp">${esc(d.fingerprint)}</div>
      <div class="devrow">
        <button class="devbtn" onclick="lanPick('${esc(d.label)}')">${sel?'Chosen':'Send to this'}</button>
        ${d.paired_as?'':`<button class="devbtn" onclick="lanPair('${esc(d.label)}')">${
          LPAIR===d.label?'Cancel':'Pair'}</button>`}
      </div>
      ${LPAIR===d.label?`
        <div class="lansub">${esc(PAIRHINT)}</div>
        <input class="lanin" placeholder="Call it what on your list?" value="${esc(LNAME)}"
          oninput="LNAME=this.value">
        <div class="devrow">
          <button class="devbtn" onclick="lanPairGo('${esc(d.label)}')" ${LBUSY?'disabled':''}>
            ${LBUSY?'Pairing...':'Those four pairs match'}</button>
        </div>`:''}
      </div>`;
  }
  const names=FILES.map(f=>f.name).join(', ');
  h+=`<div class="drop${FILES.length?' has':''}" id="drop"
        onclick="document.getElementById('fpick').click()">
      ${FILES.length?esc(names)+` &middot; ${kb(FILES.reduce((a,f)=>a+f.size,0))}`
                    :'Drop files here, or click to choose'}
    </div>
    <input type="file" id="fpick" multiple hidden onchange="lanFiles(this.files)">`;
  // Either a file or a note is enough to send. Requiring a file meant you
  // could not say "look at this machine" to someone standing next to you
  // without inventing a file to say it in.
  if(LSEL){
    h+=`<input class="lanin" id="lsubj" placeholder="Subject" value="${esc(LSUBJ)}"
           oninput="LSUBJ=this.value">
      <textarea class="lanin" id="lnote" style="min-height:4.5em"
        placeholder="Write a note (optional)" oninput="LNOTE=this.value">${esc(LNOTE)}</textarea>`;
    if(FILES.length||LNOTE.trim()){
      h+=`<div class="devrow">
        <button class="devbtn" onclick="lanSend()" ${LBUSY?'disabled':''}>
          ${LBUSY?'Sending...':'Send to '+esc((LAN.devices.find(x=>x.label===LSEL)||{}).paired_as||LSEL)}</button>
        <button class="devbtn" onclick="FILES=[];LNOTE='';lanRender()">Clear</button>
      </div>`;
    } else {
      h+=`<div class="lansub">Drop a file or write a note.</div>`;
    }
  } else if(FILES.length||LNOTE.trim()){
    h+=`<div class="lansub">Choose a machine above.</div>`;
  }
  if(LERR2)h+=`<div class="lanerr">${esc(LERR2)}</div>`;
  if(LOK)h+=`<div class="lanok">${esc(LOK)}</div>`;
  box.innerHTML=h;
  const dz=document.getElementById('drop');
  if(dz){
    dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};
    dz.ondragleave=()=>dz.classList.remove('over');
    dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');lanFiles(e.dataTransfer.files)};
  }
}
let LSUBJ='', LNOTE='';
function lanPick(l){ LSEL=(LSEL===l?null:l); LERR2='';LOK=''; lanRender(); }

async function lanFiles(fl){
  LERR2='';LOK='';
  const out=[];
  let total=0;
  for(const f of fl){
    total+=f.size;
    // Base64 in JSON inflates by a third, and the server caps the body at
    // 12MB. Refused here with the real number rather than sent and rejected.
    if(total*1.37>11*1024*1024){
      LERR2='That is too much to send through the page ('+kb(total)
        +'). Use gage send --dir in the terminal for anything large.';
      lanRender(); return;
    }
    out.push({name:f.name,size:f.size,data:await b64(f)});
  }
  FILES=out; lanRender();
}
const b64=f=>new Promise((res,rej)=>{
  const r=new FileReader();
  r.onerror=()=>rej(new Error('could not read '+f.name));
  r.onload=()=>res(String(r.result).split(',',2)[1]||'');
  r.readAsDataURL(f);
});

async function lanSend(){
  if(!LSEL||(!FILES.length&&!LNOTE.trim())||LBUSY)return;
  LBUSY=true;LERR2='';LOK='';lanRender();
  try{
    const r=await post('/api/send',{to:LSEL,subject:LSUBJ,type:'share',text:LNOTE,
      files:FILES.map(f=>({name:f.name,data:f.data}))});
    const j=await r.json().catch(()=>({}));
    if(r.ok){ LOK=(j.lines||[]).join('\n'); FILES=[]; LSUBJ=''; LNOTE=''; }
    // The outbound scan refuses here exactly as it does in the terminal, and
    // the page deliberately offers no override: --allow-findings is a reason
    // to go and look at the file, not a checkbox.
    else { LERR2=j.error||'that did not send'; }
  }catch(e){ LERR2=String(e); }
  LBUSY=false; lanRender();
}

// Pairing happens inline rather than through confirm()/prompt().
//
// Not only because blocking dialogs are unpleasant: the comparison IS the
// feature, and a browser dialog renders the four pairs in a cramped box the
// person dismisses by reflex. On the page they sit at the size everything
// else is read at, next to the name being filed, and the button says what it
// is agreeing to.
function lanPair(label){ LPAIR=(LPAIR===label?null:label); LNAME=''; LERR2='';LOK=''; lanRender(); }

async function lanPairGo(label){
  const d=LAN.devices.find(x=>x.label===label);
  if(!d||LBUSY)return;
  if(!LNAME.trim()){ LERR2='Give it a name to file it under.'; lanRender(); return; }
  LBUSY=true;LERR2='';LOK='';lanRender();
  try{
    // The fingerprint goes back up so the server can refuse if the list
    // changed under us between showing the words and clicking.
    const r=await post('/api/pair',{label:label,name:LNAME.trim(),fingerprint:d.fingerprint});
    const j=await r.json().catch(()=>({}));
    if(r.ok){ LOK=(j.lines||[]).join('\n'); LPAIR=null; LNAME=''; }
    else { LERR2=j.error||'that did not pair'; }
  }catch(e){ LERR2=String(e); }
  LBUSY=false;
  await lanLoad();
}

async function lanLoad(){
  try{
    const r=await fetch('/api/nearby');
    if(!r.ok)throw new Error('HTTP '+r.status);
    LAN=await r.json();
    if(LSEL&&!LAN.devices.some(d=>d.label===LSEL))LSEL=null;
    // The relay address lives in the same poll rather than a timer of its
    // own: it changes only when somebody presses the switch below it.
    const sr=await fetch('/api/state');
    if(sr.ok){const st=await sr.json();RELAY=st.relay||null;
      // The suggested address comes from the binary. The page deliberately
      // contains no URL of any kind -- a test asserts it -- so that nothing
      // in the viewer can point a reader anywhere but this machine.
      if(!RADDR)RADDR=st.relay_default||'';}
  }catch(e){
    // Same rule as the inbox loader: never fail invisibly.
    LERR2='Could not read the network list: '+(e&&e.message?e.message:e);
  }
  lanRender();
  netRender();
}
lanLoad();setInterval(lanLoad,2000);

// ---------------------------------------------------------------------------
// The buddy list
// ---------------------------------------------------------------------------
// Three states for a key, and the panel's whole job is that they look like
// three: on your list, asking, refused. A list that can only say yes and
// "not yet" makes refusing feel like ignoring, and the way to stop being
// asked becomes saying yes.
let BUD={buddies:[],requests:[],refused:[]}, TAB='chats';
let ASK=null, ANAME='', ACONF='', AERR='', AOK='', ABUSY=false, SHOWREF=false;
// The fingerprint, once the person has shown they read it somewhere else.
// Held per key and dropped on cancel, so it never survives into a different
// request's card.
let REVEAL=null;

// Said in full on every request, not once in a help page. The sentence that
// matters is the second one: typing a word-pair cannot prove the person
// compared it with the other screen, and a UI that implied otherwise would
// be selling a check it does not perform.
const ASKWHY='The word-pairs come from the key itself, so nobody picks their own. '
  +'This screen does not show them yet, on purpose: read the pair below off the '
  +'OTHER machine, where they must run gage fingerprint --signing-only. Get it '
  +'right and the rest are shown, so you can check all four before adding.';

// Said on the card, because it is a real limit on what this approval buys.
const ASKHALF='These words cover the SIGNING key only. A message does not carry its '
  +'sender\u2019s encryption key, so adding them here lets you verify what they '
  +'sign and not send them sealed mail. For both, get their `gage add` line and '
  +'compare the normal four pairs.';

// The limit, said where the decision is made rather than in a help page.
// A sender knows all four pairs of its own key, because they come from that
// key -- so it can write the asked-for pair into the message it sends you,
// and typing it from there satisfies this box and tells you nothing. A
// reviewer put it exactly: the server cannot tell the two sources apart.
const ASKTRAP='If this pair came from the message itself, or from anything this '
  +'key sent you, it proves nothing -- a key knows its own word-pairs and can '
  +'quote them. It only means something if it came from the other machine.';

function tabsRender(){
  const el=document.getElementById('tabs');
  if(!el)return;
  const n=BUD.requests.length;
  el.innerHTML=
    `<button class="tab${TAB==='chats'?' on':''}" onclick="setTab('chats')">Chats</button>`
   +`<button class="tab${TAB==='buddies'?' on':''}" onclick="setTab('buddies')">Buddies`
   +(n?`<span class="bdg">${n}</span>`:'')+`</button>`;
}
// The add-line QR. Fetched once: it does not change while this page is
// open, and it must not ride the 2.5s poll. Inserted as markup. An image
// URL would be blocked by this page's CSP.
let INVITE=null, inviteSeq=0;
function inviteOk(t){
  if(typeof t!=='string'||t.length<20||t.length>200000)return false;
  if(!t.startsWith('<svg ')||!t.endsWith('</svg>'))return false;
  if((t.match(/<svg/g)||[]).length!==1)return false;
  if(/<\s*(script|img|object|embed|iframe|link|foreignObject)\b|<!DOCTYPE|<\?xml/i.test(t))return false;
  return true;
}
async function inviteLoad(force){
  if(!force&&INVITE!==null)return;
  const seq=++inviteSeq;
  let next='';
  try{
    const r=await fetch('/api/invite');
    if(r.ok){const t=await r.text();if(inviteOk(t))next=t;}
  }catch(e){}
  if(seq===inviteSeq)INVITE=next;
}
function inviteHtml(){
  if(!INVITE)return '';
  return `<div class="invite"><h2>The line the other person runs</h2>
    <p>This is the public <code>gage add</code> line <code>gage connect</code> prints.
    It names this machine and its public key, and nothing else.</p>
    ${INVITE}</div>`;
}
function budpaneHtml(){
  return pasteHtml()+`<div class="hint">
      <h2>Who can reach you</h2>
      <p>Your list is the trust boundary. A key on it is one you confirmed out of
        band; a key not on it is a decision you have not taken yet. Nothing here is
        automatic, and nothing a sender writes puts it on the list.</p>
      <p>Approving one asks for a word-pair you have to read off the other machine.
        That is not a formality: the pairs come from the key, so a key can quote its
        own in a message to you, and only the other machine's screen is evidence.</p>
      <p>Refusing records that you said no. It is not a block &mdash; nothing in gage
        can stop a bundle being delivered, and mail from a refused key still arrives
        and still waits for you to accept it.</p>
      <p><code>gage decline &lt;key&gt;</code> and <code>gage undecline &lt;key&gt;</code>
        do the same from a terminal.</p></div>`+inviteHtml();
}
function pasteHtml(){
  let h=`<div class="hint"><h2>Paste an invite</h2>
    <p>Paste the other person's complete <code>gage add</code> line. The clipboard is read only when you press the button.</p>
    <button class="devbtn" onclick="pasteClipboard()">Read clipboard</button>
    <textarea class="lanin" style="width:100%;margin-top:8px" aria-label="Invite text"
      placeholder="Paste or type the complete gage add line" oninput="PASTED=this.value">${esc(PASTED)}</textarea>
    <div class="devrow"><button class="devbtn" onclick="pasteInvite()">Use this invite</button></div>
    ${AERR?`<div class="berr">${esc(AERR)}</div>`:''}${AOK?`<div class="bok">${esc(AOK)}</div>`:''}</div>`;
  if(PKEY)h+=`<div class="bwhy">Invite parsed. The existing request card now has the suggested name and pairing check.</div>`;
  return h;
}
async function pasteClipboard(){
  try{if(navigator.clipboard&&navigator.clipboard.readText){const t=await navigator.clipboard.readText();if(t){PASTED=t;budRender(true);}}}catch(e){/* Keep the editable paste field as the fallback. */}
}
async function pasteInvite(){
  AERR='';AOK='';PREVEAL=null;PKEY='';
  try{
    const r=await fetch('/api/parse-invite',{method:'POST',headers:{'X-Gage':'1','Content-Type':'application/json'},body:JSON.stringify({text:PASTED})});
    const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||('HTTP '+r.status));
    PKEY=j.key;PNAME=j.suggested_name||'';PPAIR=j.ask_pair;PCONF='';ASK=PKEY;ANAME=PNAME;ACONF='';REVEAL=null;
  }catch(e){AERR=e&&e.message?e.message:String(e)}
  if(TAB==='buddies')budRender(true);
}
function setTab(t){
  TAB=t;
  // In the URL, so a reload keeps the tab you were on -- this page polls and
  // re-renders constantly, and losing your place on every refresh is the
  // kind of small thing that makes a tool feel untrustworthy.
  hashSync();
  for(const [id,show] of [['filters',t==='chats'],['list',t==='chats'],
                          ['lanbox',t==='chats'],['netbox',t==='chats'],['buddies',t==='buddies'],
                          // The right-hand pane belongs to whichever tab is
                          // showing. It used to keep the Chats empty state --
                          // "Pick a conversation" -- next to the buddy list,
                          // which reads as a page that half-loaded.
                          ['msgs',t==='chats'],['budpane',t==='buddies']]){
    const el=document.getElementById(id); if(el)el.hidden=!show;
  }
  // The rail says the product name and keeps saying it; which section you
  // are in is the heading of the section, where a heading belongs.
  const appEl=document.getElementById('app');
  if(appEl)appEl.classList.toggle('buds',t==='buddies');
  const bb=document.getElementById('budback'); if(bb)bb.hidden=(t!=='buddies');
  if(t==='buddies'){
    document.getElementById('title').textContent='Buddies';
    const c=document.getElementById('composer'); if(c)c.hidden=true;
    const se=document.getElementById('settle'); if(se)se.hidden=true;
    document.getElementById('hstate').textContent='';
    budRender(true);
    if(INVITE===null)inviteLoad(false).then(()=>{if(TAB==='buddies'){
      budRender(true);
    }});
  }else{
    document.getElementById('title').textContent='Conversations';
  }
  tabsRender(); budRender(true);
}
// The tab, and which decision is open, live in the URL. This page polls and
// re-renders constantly; losing your place on a refresh is the kind of small
// thing that makes a tool feel untrustworthy, and a decision you walked away
// from is exactly the one worth being able to come back to.
function hashSync(){
  let h='';
  if(TAB==='buddies')h = ASK ? '#buddies='+encodeURIComponent(ASK) : '#buddies';
  try{ history.replaceState(null,'',h||location.pathname); }catch(e){}
}
function hashRead(){
  const h=decodeURIComponent(location.hash||'');
  if(!h.startsWith('#buddies'))return;
  TAB='buddies';
  const i=h.indexOf('=');
  if(i>0)ASK=h.slice(i+1);
}
function askOpen(k){
  ASK=(ASK===k?null:k); ANAME='';ACONF='';AERR='';AOK='';
  if(!ASK||(REVEAL&&REVEAL.key!==ASK))REVEAL=null;
  hashSync(); budRender(true);
}

async function budReveal(k){
  ABUSY=true;AERR='';AOK='';budRender(true);
  try{
    const r=await fetch('/api/connect',{method:'POST',
      headers:{'X-Gage':'1','Content-Type':'application/json'},
      body:JSON.stringify({key:k,name:'',confirm:ACONF})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
    // The confirmed pair is KEPT, in REVEAL, because the add call has to
    // resend it. The first version cleared ACONF here and then sent ACONF on
    // add, so the add always failed the server's check and the button was
    // dead. The API tests passed because they drove the endpoint directly;
    // only reading the page found it.
    REVEAL={key:k,fp:(j.lines||[])[1]||'',pair:ACONF};
    ACONF='';
  }catch(e){ AERR=(e&&e.message)?e.message:String(e); }
  ABUSY=false; budRender(true);
}

function reachRow(r){
  // Each path says what it knows and no more. `relay` especially: mail can be
  // left there, which is not the same as anybody collecting it, and this
  // panel must not become the presence roster the project has twice refused.
  // No per-contact recency, on purpose: a named list with an "Xs ago" that
  // refreshes is a presence roster whatever it is called, and this project
  // has refused one three times. Each label says what it is evidence of.
  const bits=[
    ['routed under this name', r.routed_by_name,
     'A local route is filed under this name, which is the name sending resolves too. '
     +'It is your label, not their identity.'],
    ['on this network now', r.lan_now,
     'This key is announcing itself on this network, which it chose to do by running '
     +'gage lan. Nothing here polls anybody.'],
    ['mail can be left', r.can_leave_mail,
     'You are joined to a relay and hold an encryption key for them, so mail CAN be '
     +'left. This is about your setup, not about them -- whether they ever collect it '
     +'is not something this machine can know.'],
  ];
  return `<div class="bdots">`+bits.map(([t,on,title])=>
    `<span class="breach${on?' on':''}" title="${esc(title)}"><i></i>${t}</span>`).join('')+`</div>`;
}

function budRender(force){
  // The whole buddies page is rendered here, into the wide pane. It used to
  // be split: cards in the rail, the prose explaining them in the pane. That
  // put the thing you act on in the narrowest column on the screen.
  const box=document.getElementById('budpane');
  if(!box||TAB!=='buddies')return;
  let h='';
  const requests=(BUD.requests||[]).map(q=>q.key===PKEY?{...q,label:PNAME||q.label,
    ask_pair:PPAIR,pasted:true}:q);
  if(PKEY&&!requests.some(q=>q.key===PKEY))requests.unshift({key:PKEY,label:PNAME||'Pasted invite',
    bundles:0,verdict:'SENDER NOT ON YOUR LIST',first_observed:null,ask_pair:PPAIR,pasted:true});
  if(requests.length){
    h+=`<div class="bsec">Not on your list<span class="bnum">${requests.length}</span></div>`
     +`<div class="lansub budnote" style="margin-bottom:8px">${requests.some(q=>q.pasted)?'Pasted invites and keys that have sent you something are not on your list. ':''}A message is not a request for anything &mdash; deciding is yours, and doing nothing is a decision the list will keep offering.</div>`
     +`<div class="budgrid">`;
    for(const q of requests){
      const open=ASK===q.key;
      const shown=(REVEAL&&REVEAL.key===q.key)?REVEAL.fp:null;
      h+=`<div class="dev ask">
        <div class="devtop"><span class="devname">${esc(q.label)}</span>
          <span class="devtag">${q.bundles} message${q.bundles===1?'':'s'}</span>
          </div>
        <div class="bwhy" style="margin-top:5px">${esc(vShort(q.verdict))}
          ${q.first_observed?'&middot; first seen here '+esc(ago(q.first_observed)):''}
          &middot; pair 1 of its fingerprint is <b>${esc(q.label)}</b></div>
        ${shown?`<div class="devfp">${esc(shown)}</div>`:''}
        <div class="devrow">
          <button class="devbtn" onclick="askOpen('${esc(q.key)}')">${open?'Cancel':'Add to my list'}</button>
          <button class="devbtn" onclick="budDecline('${esc(q.key)}',false)" ${ABUSY?'disabled':''}
            title="Records that you said no. It does not block anything: mail from this key still arrives and still waits for you to accept it.">Refuse</button>
        </div>
        <div class="bwhy">Refusing records the decision so you are not asked again. It does
          not stop anything arriving.</div>`;
      if(open&&!shown){
        h+=`<div class="bgate">
          <div class="bwhy">${esc(ASKWHY)}</div>
          <div class="bwhy">${esc(ASKHALF)}</div>
          <div class="bwhy" style="color:var(--warn)">${esc(ASKTRAP)}</div>
          ${q.pasted?`<div class="bwhy">Suggested name (edit as needed)</div>
            <input class="lanin" placeholder="Name for this contact" value="${esc(ANAME)}"
              oninput="ANAME=this.value" style="width:100%">`:''}
          <div class="bwhy">Type pair <b>${q.ask_pair}</b> of four, as the other machine shows it.</div>
          <input class="lanin" placeholder="pair ${q.ask_pair}, e.g. two words" value="${esc(ACONF)}"
            oninput="ACONF=this.value" onkeydown="if(event.key==='Enter')budReveal('${esc(q.key)}')"
            style="width:100%">
          <div class="devrow">
            <button class="devbtn" onclick="budReveal('${esc(q.key)}')" ${ABUSY?'disabled':''}>
              ${ABUSY?'Checking...':'Check this pair'}</button>
          </div></div>`;
      }else if(open&&shown){
        h+=`<div class="bgate">
          <div class="bwhy">Pair ${q.ask_pair} matched. Now check <b>all four</b> above against
            the other machine before you add anything &mdash; one matching pair is 16 bits, and
            a key can be ground out to produce a chosen one.</div>
          <input class="lanin" placeholder="Call them what on your list?" value="${esc(ANAME)}"
            oninput="ANAME=this.value" style="width:100%">
          <div class="devrow">
            <button class="devbtn" onclick="budConnect('${esc(q.key)}')" ${ABUSY?'disabled':''}>
              ${ABUSY?'Adding...':'All four match -- add them'}</button>
          </div></div>`;
      }
      h+=`</div>`;
    }
    h+=`</div>`;
  }
  h+=`<div class="bsec">Your list<span class="bnum">${BUD.buddies.length}</span></div>`;
  if(!BUD.buddies.length){
    h+=`<div class="lansub budnote">Nobody yet. Pair with a buddy on this network to add their key.</div>`;
  }
  h+=`<div class="budgrid">`;
  for(const b of BUD.buddies){
    h+=`<div class="dev">
      <div class="devtop"><span class="devname">${esc(b.name)}</span>
        ${b.unread?`<span class="bnum">${b.unread} unread</span>`:''}
        ${b.sealable?'<span class="devtag ok">sealable</span>'
                    :'<span class="devtag" title="A bundle does not carry its sender\'s encryption key, so a contact added from a message is verify-only.">verify only</span>'}</div>
      <div class="devfp">${esc(b.fingerprint)}</div>
      ${reachRow(b.reach)}
    </div>`;
  }
  h+=`</div>`;
  if(BUD.refused.length){
    h+=`<div class="bsec"><a href="#" onclick="SHOWREF=!SHOWREF;budRender(true);return false"
      style="color:inherit">Refused (${BUD.refused.length}) ${SHOWREF?'&#9662;':'&#9656;'}</a></div>`;
    if(SHOWREF){
      h+=`<div class="lansub" style="margin-bottom:8px">Refusing records a decision. It does
        not block anything &mdash; nothing in gage can stop a bundle being delivered, and
        mail from these keys still arrives and still waits for you to accept it. What it
        buys is that you are not asked about these again. Their word-pairs are not shown
        here, so that un-refusing one puts you back in front of the same check.</div>
        <div class="budgrid">`;
      for(const r of BUD.refused){
        h+=`<div class="dev">
          <div class="devtop"><span class="devname">${esc(r.label)}</span>
            <span class="devtag">refused ${esc(r.at)}</span>
            ${r.holding?`<span class="devtag">${r.holding} here now</span>`:''}</div>
          <div class="devrow">
            <button class="devbtn" onclick="budDecline('${esc(r.key)}',true)" ${ABUSY?'disabled':''}>
              Un-refuse</button>
          </div></div>`;
      }
      h+=`</div>`;
    }
  }
  // AERR and AOK are printed by pasteHtml, which is concatenated below.
  // Printing them here as well put the same failure on the screen twice.

  // This page polls every 2.5 seconds, and replacing innerHTML destroys the
  // focused node. That was survivable while the only inputs here were the
  // pairing fields, whose text is held in ANAME and ACONF and restored on
  // the next render -- the caret moved, which was already wrong. Since the
  // paste textarea moved into this subtree it is not survivable at all:
  // typing an invite line lost focus mid-word every 2.5 seconds.
  //
  // So a poll that would clobber a field somebody is typing in does not
  // render. An action the person takes always calls budRender directly, and
  // those paths pass force, because the whole point of them is that the
  // answer changed.
  const box2 = box;
  const active = document.activeElement;
  if (!force && active && box2.contains(active)
      && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;
  // Paste, then the standing explanation, below the cards rather than beside
  // them: a person opens this tab to decide about somebody, not to read.
  box.innerHTML=`<div class="budwrap">${h}${budpaneHtml()}</div>`;
}

async function budPost(path,body){
  ABUSY=true;AERR='';AOK='';budRender(true);
  try{
    const r=await fetch(path,{method:'POST',headers:{'X-Gage':'1','Content-Type':'application/json'},
      body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
    AOK=(j.lines||[]).filter(x=>x&&x.trim()).join(' ');
    ASK=null;ANAME='';ACONF='';REVEAL=null;
    if(path==='/api/connect'){PKEY='';PNAME='';PPAIR=0;PASTED='';}
  }catch(e){ AERR=(e&&e.message)?e.message:String(e); }
  ABUSY=false; await budLoad(); load();
}
function budConnect(k){
  const p = (REVEAL && REVEAL.key===k) ? REVEAL.pair : ACONF;
  budPost('/api/connect',{key:k,name:ANAME,confirm:p});
}
function budDecline(k,undo){ budPost('/api/decline',{key:k,undo:!!undo}); }

async function budLoad(){
  try{
    const r=await fetch('/api/buddies');
    if(!r.ok)throw new Error('HTTP '+r.status);
    BUD=await r.json();
    if(ASK&&!BUD.requests.some(q=>q.key===ASK))ASK=null;
  }catch(e){
    // Same rule as every other loader here: never fail invisibly.
    AERR='Could not read your list: '+(e&&e.message?e.message:e);
  }
  tabsRender(); budRender();
}
budLoad();setInterval(budLoad,2500);
hashRead();
setTab(TAB);

// First-run guide. It uses the same local endpoints and nearby-device data as
// the console. The ceremony requires an explicit spoken-comparison checkbox
// before the fingerprint shown here is submitted to /api/pair.
let W={stage:'welcome',handle:'',words:[],warning:'',devices:[],chosen:'',name:'',compared:false,
  subject:'Hello from gage',message:'I have set up gage. Reply when you are ready.',error:'',busy:false};
function wRender(){
  const el=document.getElementById('wizard'); if(!el)return;
  const field=(id,val,placeholder)=>`<input class="winput" id="${id}" value="${esc(val)}" placeholder="${placeholder}" oninput="W.${id==='whandle'?'handle':id==='wname'?'name':id==='wsubject'?'subject':'message'}=this.value">`;
  let body='';
  if(W.stage==='welcome')body=`<h1>Welcome to gage</h1><p>Gage lets you exchange signed bundles with people you know. First choose a name for this machine, then compare word-pairs with a buddy before you send them a first bundle.</p><button class="btn go" onclick="W.stage='handle';wRender()">Get started</button>`;
  if(W.stage==='handle')body=`<h1>Choose a handle</h1><p>This name helps you and your buddies recognize this machine.</p>${field('whandle',W.handle,'Your handle')}<button class="btn go" onclick="wCreate()" ${W.busy?'disabled':''}>${W.busy?'Creating…':'Create identity'}</button>`;
  if(W.stage==='words')body=`<h1>Your word-pairs</h1><p>Keep these pairs available while you compare them with your buddy. They identify this machine.</p><div class="wwords">${esc(W.words.join('\n'))}</div><p>${esc(W.warning)}</p><p>For a backup, run <code>gage export-identity</code> in a terminal and keep the exported file safe.</p>`+inviteHtml()+`<button class="btn go" onclick="wNearby()">Continue to pairing</button>`;
  if(W.stage==='pair'){
    const d=W.devices.find(x=>x.label===W.chosen);
    body=`<h1>Pair with a buddy</h1><p>Both machines must be running <code>gage lan</code> on the same network. Select your buddy, read all four pairs aloud, and compare them with the other screen.</p>`+
      (W.devices.length?W.devices.map(x=>`<label class="wcheck"><input type="radio" name="wdevice" ${W.chosen===x.label?'checked':''} onchange="W.chosen='${esc(x.label)}';W.compared=false;wRender()"><span>${esc(x.paired_as||x.label)}</span></label>${W.chosen===x.label?`<div class="wwords">${esc(x.fingerprint)}</div>`:''}`).join(''):'<p>No nearby machines yet. Start <code>gage lan</code> on both machines, then refresh this step.</p>')+
      `<button class="btn" onclick="wNearby()">Refresh nearby machines</button>`+
      (d?`<label class="wcheck"><input type="checkbox" ${W.compared?'checked':''} onchange="W.compared=this.checked;wRender()"><span>We compared these aloud and all four pairs match.</span></label>${field('wname',W.name,'Name for this buddy')}<button class="btn go" onclick="wPair()" ${!W.compared||W.busy?'disabled':''}>${W.busy?'Pairing…':'Pair buddy'}</button>`:'');
  }
  if(W.stage==='send')body=`<h1>Send your first bundle</h1><p>Write a short message for ${esc(W.name)}. Gage will send it through the existing bundle flow.</p>${field('wsubject',W.subject,'Subject')}<textarea class="winput" id="wmessage" oninput="W.message=this.value">${esc(W.message)}</textarea><button class="btn go" onclick="wSend()" ${W.busy?'disabled':''}>${W.busy?'Sending…':'Send first bundle'}</button>`;
  if(W.stage==='done')body=`<h1>You’re set up</h1><p>Your first bundle was sent. You can continue in the gage console.</p><button class="btn go" onclick="document.getElementById('wizard').hidden=true">Open console</button>`;
  el.innerHTML=`<section class="wcard">${body}${W.error?`<div class="werror">${esc(W.error)}</div>`:''}</section>`;
}
async function wCreate(){
  W.busy=true;W.error='';wRender();
  try{const r=await post('/api/init',{handle:W.handle});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||`HTTP ${r.status}`);
    W.handle=j.handle;W.words=Array.isArray(j.words)?j.words:(typeof j.words==='string'?j.words.split('\n'):[]);W.warning=j.backup_warning||'';W.stage='words';
    await inviteLoad(true);
  }catch(e){W.error=e.message||String(e)} W.busy=false;wRender();
}
async function wNearby(){
  W.error='';try{const r=await fetch('/api/nearby');if(!r.ok)throw Error(`HTTP ${r.status}`);const j=await r.json();W.devices=j.devices||[];W.chosen='';W.compared=false;W.stage='pair';}
  catch(e){W.error=e.message||String(e)}wRender();
}
async function wPair(){
  const d=W.devices.find(x=>x.label===W.chosen);if(!d||!W.compared)return;
  W.busy=true;W.error='';wRender();
  try{const r=await post('/api/pair',{label:d.label,name:W.name.trim(),fingerprint:d.fingerprint});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||`HTTP ${r.status}`);W.stage='send';}
  catch(e){W.error=e.message||String(e)}W.busy=false;wRender();
}
function wB64(s){const bytes=new TextEncoder().encode(s);let bin='';for(const b of bytes)bin+=String.fromCharCode(b);return btoa(bin)}
async function wSend(){
  if(!W.message.trim())return;W.busy=true;W.error='';wRender();
  try{const r=await post('/api/send',{to:W.name.trim(),subject:W.subject.trim(),type:'share',files:[{name:'hello.txt',data:wB64(W.message)}]});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||`HTTP ${r.status}`);W.stage='done';}
  catch(e){W.error=e.message||String(e)}W.busy=false;wRender();
}
async function wStart(){try{const r=await fetch('/api/state');if(!r.ok)throw Error(`HTTP ${r.status}`);const s=await r.json();if(s.has_identity===false){document.getElementById('wizard').hidden=false;wRender()}}
  catch(e){/* Existing console loader reports API availability failures. */}}
wStart();

load();setInterval(load,2500);
</script>
