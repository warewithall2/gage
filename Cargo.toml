[package]
name = "gage"
version = "0.3.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Hand context between agents — files, prompts and decisions — with a trust boundary that survives the hop."
repository = "https://github.com/warewithall2/gage"
homepage = "https://github.com/warewithall2/gage"

[dependencies]
# Identity backup, and nothing else. Both are pinned to the RustCrypto
# generation `crypto_box` already pulls in (aead 0.5, poly1305 0.8, cipher
# 0.4, blake2 0.10) rather than to the newest tag: the newer majors would put
# a second version of each of those primitives in the binary, and for a
# security feature one audited copy of each matters more than being current.
# Five new crates in total, no primitive at two versions.
argon2 = "0.5"
chacha20poly1305 = "0.10"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
crypto_box = { version = "0.9.1", features = ["seal", "rand_core"] }
ed25519-dalek = "3.0.0"
# `ring` rather than the default `aws-lc-rs`. Not a preference: aws-lc-sys
# is C, compiled against the build machine's headers, and it pulled in
# `__isoc23_sscanf`/`__isoc23_strtol` (GLIBC_2.38) -- so a binary built here
# would not start on Ubuntu 22.04, which is what the relay host runs and what
# a great many other machines run. A release binary that only runs on the
# machine that built it is not a release.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
webpki-roots = "1.0"
# The public `gage add` line, drawn as SVG the page inserts as markup.
# Nothing is fetched when it is shown: the page already refuses every
# external load, and an `<img src>` would be one.
#
# Defaults stay off. This crate's default features are `image`, `svg` and
# `pic`, and `image` is its one optional dependency -- leaving the defaults
# on would pull an image codec this binary does not use, which is the same
# mistake the `ring` pin above exists to avoid (a stack you did not ask
# for, compiled into a release). `svg` is an empty feature: the renderer
# ships in the crate, so this pin is one crate, no transitive crate, and
# no C. The licence line is already MIT OR Apache-2.0. 0.14.1 is that
# crate's last release; `qrcode-rs` 2.x is a different crate, with a
# default set that turns on image, svg, pic, eps, html and pdf.
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
