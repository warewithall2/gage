[package]
name = "ctx"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
crypto_box = { version = "0.9.1", features = ["seal", "rand_core"] }
ed25519-dalek = "3.0.0"
rustls = "0.23"
rustls-pki-types = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
webpki-roots = "1.0"
